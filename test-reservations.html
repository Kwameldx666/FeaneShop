<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="gateway-origin" content="http://localhost:5000">
    <title>Test Reservations API</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .output { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; white-space: pre-wrap; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Test Reservations API</h1>
    
    <div>
        <h2>Gateway Info</h2>
        <div id="gateway-info" class="output">Loading...</div>
    </div>
    
    <div>
        <h2>Actions</h2>
        <button onclick="testGetReservations()">GET /api/reservations</button>
        <button onclick="testGetReservationsWithUserId()">GET /api/reservations?userId=test-guid</button>
        <button onclick="checkAuth()">Check JWT Token</button>
    </div>
    
    <div>
        <h2>Response</h2>
        <div id="response" class="output">No request yet...</div>
    </div>

    <script src="http://localhost:5003/js/gateway-client.js"></script>
    <script>
        function log(message, type = 'info') {
            const output = document.getElementById('response');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            output.innerHTML = `[${timestamp}] <span class="${className}">${message}</span>`;
        }

        function logJson(data) {
            const output = document.getElementById('response');
            output.textContent = JSON.stringify(data, null, 2);
        }

        // Display gateway info
        document.addEventListener('DOMContentLoaded', function() {
            const info = document.getElementById('gateway-info');
            if (window.feaneGateway && window.FEANE_GATEWAY_BASE_URL) {
                info.innerHTML = `
Gateway Base URL: ${window.FEANE_GATEWAY_BASE_URL}
Gateway Client: ${typeof window.feaneGateway}
Gateway.get: ${typeof window.feaneGateway.get}
Gateway.post: ${typeof window.feaneGateway.post}
                `;
            } else {
                info.textContent = 'Gateway client not loaded!';
                info.classList.add('error');
            }
        });

        async function testGetReservations() {
            log('Loading reservations from /api/reservations...', 'info');
            try {
                const response = await window.feaneGateway.get('/api/reservations');
                log('SUCCESS: Got response', 'success');
                logJson(response);
            } catch (error) {
                log(`ERROR: ${error.message}`, 'error');
                logJson(error);
            }
        }

        async function testGetReservationsWithUserId() {
            const testUserId = '00000000-0000-0000-0000-000000000001';
            log(`Loading reservations for userId=${testUserId}...`, 'info');
            try {
                const response = await window.feaneGateway.get(`/api/reservations?userId=${testUserId}`);
                log('SUCCESS: Got response', 'success');
                logJson(response);
            } catch (error) {
                log(`ERROR: ${error.message}`, 'error');
                logJson(error);
            }
        }

        function checkAuth() {
            const token = localStorage.getItem('jwt');
            const output = document.getElementById('response');
            
            if (!token) {
                output.textContent = 'No JWT token found in localStorage';
                return;
            }

            try {
                const parts = token.split('.');
                const payload = JSON.parse(atob(parts[1]));
                output.textContent = 'JWT Token Payload:\n' + JSON.stringify(payload, null, 2);
            } catch (e) {
                output.textContent = 'Error parsing token: ' + e.message;
            }
        }
    </script>
</body>
</html>
