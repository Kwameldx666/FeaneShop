name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: services/gateway/FeaneGateway.Tests/FeaneGateway.Tests.csproj
            name: services-gateway-FeaneGateway.Tests
          - project: services/user-service/UserService.Tests/UserService.Tests.csproj
            name: services-user-service-UserService.Tests
          - project: services/OrderService/OrderService.Tests/OrderService.Tests.csproj
            name: services-OrderService-OrderService.Tests
          - project: services/product-service/ProductService.Tests/ProductService.Tests.csproj
            name: services-product-service-ProductService.Tests
          - project: services/reservation-service/ReservationService.Tests/ReservationService.Tests.csproj
            name: services-reservation-service-ReservationService.Tests
          - project: services/cart-service/CartService.Tests/CartService.Tests.csproj
            name: services-cart-service-CartService.Tests
          - project: services/book-service/BookService.Tests/BookService.Tests.csproj
            name: services-book-service-BookService.Tests
          - project: services/AnalyticsService/AnalyticsService.Tests/AnalyticsService.Tests.csproj
            name: services-AnalyticsService-AnalyticsService.Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test project - ${{ matrix.name }}
        run: |
          mkdir -p TestResults
          dotnet test "${{ matrix.project }}" \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=${{ matrix.name }}.trx" \
            --results-directory ./TestResults

      - name: Upload test results - ${{ matrix.name }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults/*.trx
          if-no-files-found: warn
