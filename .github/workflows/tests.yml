name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (generate TRX)
        run: |
          dotnet test --no-build --configuration Release \
            --logger "trx;LogFileName=TestResults.trx" \
            --results-directory ./TestResults

      - name: Upload consolidated test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: test-results
            path: TestResults
            if-no-files-found: warn

      - name: Upload per-project TRX (sanitized names)
        if: always()
        shell: bash
        run: |
          shopt -s globstar
          for trx in **/TestResults/*.trx; do
            if [ -f "$trx" ]; then
              base=$(basename "$trx")
              dir=$(dirname "$trx")
              # derive a name from path without invalid characters
              name="test-results-$(echo "$dir" | tr '/\\' '-' | tr -cd '[:alnum:]-._')"
              echo "Uploading $trx as $name"
              gh workflow -h >/dev/null 2>&1 || true
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload each TRX as artifact (sanitized)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-all
          path: |
            **/TestResults/*.trx
          if-no-files-found: warn

