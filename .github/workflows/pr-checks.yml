name: 🔍 Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  pr-info:
    name: 📋 PR Information
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 📊 PR Summary
      run: |
        echo "### 📋 Pull Request Information" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| PR Number | #${{ github.event.pull_request.number }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Title | ${{ github.event.pull_request.title }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Author | @${{ github.event.pull_request.user.login }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Base Branch | ${{ github.event.pull_request.base.ref }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Head Branch | ${{ github.event.pull_request.head.ref }} |" >> $GITHUB_STEP_SUMMARY
    
    - name: 📈 Changed files
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 📁 Changed Files:" >> $GITHUB_STEP_SUMMARY
        git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | while read file; do
          echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
        done

  lint-and-format:
    name: 🎨 Lint & Format
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 📦 Restore dependencies
      run: dotnet restore
    
    - name: 🔨 Build solution
      run: dotnet build --no-restore --configuration Release
    
    - name: 🎨 Check formatting
      run: |
        dotnet format --verify-no-changes --verbosity diagnostic || {
          echo "### ⚠️ Code Formatting Issues Found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please run \`dotnet format\` locally to fix formatting issues." >> $GITHUB_STEP_SUMMARY
          exit 1
        }
      continue-on-error: true

  build-validation:
    name: 🔨 Build Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 📦 Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: 📦 Restore dependencies
      run: dotnet restore
    
    - name: 🔨 Build solution
      run: dotnet build --no-restore --configuration Release --verbosity normal
    
    - name: ✅ Build success
      run: |
        echo "### ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "All projects built successfully without errors." >> $GITHUB_STEP_SUMMARY

  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: build-validation
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 📦 Restore and build
      run: |
        dotnet restore
        dotnet build --no-restore --configuration Release
    
    - name: 🧪 Run all tests
      run: |
        dotnet test --no-build \
          --configuration Release \
          --verbosity normal \
          --logger "trx;LogFileName=test-results.trx" \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults
      continue-on-error: true
    
    - name: 📊 Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          ./TestResults/**/*.trx
        check_name: "Unit Test Results"
        comment_title: "🧪 Test Results"
    
    - name: 📈 Test summary
      if: always()
      run: |
        echo "### 🧪 Unit Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Unit tests have been executed. Check the detailed results above." >> $GITHUB_STEP_SUMMARY

  security-check:
    name: 🔒 Security Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 📦 Restore dependencies
      run: dotnet restore
    
    - name: 🔍 Check for vulnerable packages
      run: |
        dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
        
        if grep -q "has the following vulnerable packages" vulnerability-report.txt; then
          echo "### ⚠️ Vulnerable Packages Found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat vulnerability-report.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ✅ No Vulnerable Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No known vulnerabilities found in dependencies." >> $GITHUB_STEP_SUMMARY
        fi
      continue-on-error: true

  code-coverage:
    name: 📊 Code Coverage
    runs-on: ubuntu-latest
    needs: unit-tests
    if: always()
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 📦 Restore and build
      run: |
        dotnet restore
        dotnet build --no-restore --configuration Release
    
    - name: 🧪 Run tests with coverage
      run: |
        dotnet test --no-build \
          --configuration Release \
          --collect:"XPlat Code Coverage" \
          --results-directory ./coverage
      continue-on-error: true
    
    - name: 📊 Coverage summary
      run: |
        echo "### 📊 Code Coverage" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Coverage reports have been generated." >> $GITHUB_STEP_SUMMARY
        echo "To view detailed coverage, check the artifacts." >> $GITHUB_STEP_SUMMARY
    
    - name: 📤 Upload coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: code-coverage
        path: ./coverage/**/coverage.cobertura.xml
        retention-days: 30

  pr-checks-summary:
    name: ✅ PR Checks Summary
    runs-on: ubuntu-latest
    needs: [pr-info, lint-and-format, build-validation, unit-tests, security-check]
    if: always()
    
    steps:
    - name: 📊 Final summary
      run: |
        echo "### ✅ Pull Request Checks Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "All automated checks have been executed." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### Check Status:" >> $GITHUB_STEP_SUMMARY
        echo "- PR Info: ${{ needs.pr-info.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Lint & Format: ${{ needs.lint-and-format.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build: ${{ needs.build-validation.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Tests: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Security: ${{ needs.security-check.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Please review the results and address any issues before merging." >> $GITHUB_STEP_SUMMARY
