name: 🌙 Nightly Build

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  nightly-build:
    name: 🔨 Nightly Build
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 📦 Restore dependencies
      run: dotnet restore
    
    - name: 🔨 Build solution (Debug)
      run: dotnet build --configuration Debug --no-restore
    
    - name: 🔨 Build solution (Release)
      run: dotnet build --configuration Release --no-restore
    
    - name: ✅ Build status
      run: |
        echo "### 🌙 Nightly Build Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Configuration | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|---------------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Debug | ✅ Success |" >> $GITHUB_STEP_SUMMARY
        echo "| Release | ✅ Success |" >> $GITHUB_STEP_SUMMARY

  nightly-tests:
    name: 🧪 Nightly Tests
    runs-on: ubuntu-latest
    needs: nightly-build
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 📦 Restore and build
      run: |
        dotnet restore
        dotnet build --configuration Release --no-restore
    
    - name: 🧪 Run all tests
      run: |
        dotnet test --configuration Release \
          --no-build \
          --verbosity detailed \
          --logger "trx;LogFileName=nightly-tests.trx" \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults
      continue-on-error: true
    
    - name: 📊 Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: nightly-test-results
        path: ./TestResults/**/*.trx
        retention-days: 90

  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    needs: nightly-build
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 📦 Restore dependencies
      run: dotnet restore
    
    - name: 🔍 Security audit
      run: |
        echo "### 🔒 Security Audit Report" > security-audit.md
        echo "" >> security-audit.md
        echo "**Date:** $(date)" >> security-audit.md
        echo "" >> security-audit.md
        
        dotnet list package --vulnerable --include-transitive 2>&1 | tee -a security-audit.md
    
    - name: 📤 Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-audit-report
        path: security-audit.md
        retention-days: 90

  dependency-check:
    name: 📦 Dependency Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 📦 List outdated packages
      run: |
        echo "### 📦 Outdated Packages Report" > outdated-packages.md
        echo "" >> outdated-packages.md
        echo "**Date:** $(date)" >> outdated-packages.md
        echo "" >> outdated-packages.md
        
        dotnet list package --outdated 2>&1 | tee -a outdated-packages.md
      continue-on-error: true
    
    - name: 📤 Upload dependency report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-report
        path: outdated-packages.md
        retention-days: 90

  docker-build-test:
    name: 🐳 Docker Build Test
    runs-on: ubuntu-latest
    needs: nightly-build
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 🔨 Test Docker Compose build
      run: |
        docker-compose build --parallel
      timeout-minutes: 30
      continue-on-error: true
    
    - name: 📊 Docker build summary
      run: |
        echo "### 🐳 Docker Build Test" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Docker Compose build completed." >> $GITHUB_STEP_SUMMARY

  code-metrics:
    name: 📊 Code Metrics
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 📊 Generate metrics
      run: |
        echo "### 📊 Code Metrics Report" > metrics.md
        echo "" >> metrics.md
        echo "**Date:** $(date)" >> metrics.md
        echo "" >> metrics.md
        
        echo "#### Project Statistics:" >> metrics.md
        echo "- Total projects: $(find . -name '*.csproj' | wc -l)" >> metrics.md
        echo "- C# files: $(find . -name '*.cs' | wc -l)" >> metrics.md
        echo "- Total lines of code: $(find . -name '*.cs' -exec cat {} \; | wc -l)" >> metrics.md
        echo "- Test projects: $(find . -name '*.Tests.csproj' | wc -l)" >> metrics.md
        echo "" >> metrics.md
        
        echo "#### Git Statistics:" >> metrics.md
        echo "- Total commits: $(git rev-list --all --count)" >> metrics.md
        echo "- Contributors: $(git log --format='%aN' | sort -u | wc -l)" >> metrics.md
        echo "- Branches: $(git branch -r | wc -l)" >> metrics.md
        echo "" >> metrics.md
        
        cat metrics.md
    
    - name: 📤 Upload metrics report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: code-metrics-report
        path: metrics.md
        retention-days: 90

  nightly-summary:
    name: 📋 Nightly Summary
    runs-on: ubuntu-latest
    needs: [nightly-build, nightly-tests, security-audit, dependency-check, docker-build-test, code-metrics]
    if: always()
    
    steps:
    - name: 📊 Generate summary
      run: |
        echo "### 🌙 Nightly Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### Job Status:" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Nightly Build | ${{ needs.nightly-build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Nightly Tests | ${{ needs.nightly-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Audit | ${{ needs.security-audit.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Dependency Check | ${{ needs.dependency-check.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Docker Build Test | ${{ needs.docker-build-test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Code Metrics | ${{ needs.code-metrics.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 📦 Artifacts:" >> $GITHUB_STEP_SUMMARY
        echo "- Test results" >> $GITHUB_STEP_SUMMARY
        echo "- Security audit report" >> $GITHUB_STEP_SUMMARY
        echo "- Dependency report" >> $GITHUB_STEP_SUMMARY
        echo "- Code metrics report" >> $GITHUB_STEP_SUMMARY
