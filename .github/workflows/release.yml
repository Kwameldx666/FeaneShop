name: 📦 Release Management

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  DOTNET_VERSION: '9.0.x'
  REGISTRY: ghcr.io

jobs:
  create-release:
    name: 🏷️ Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 🏷️ Get version
      id: get-version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: 📝 Generate changelog
      id: changelog
      run: |
        echo "### 🎉 What's New in ${{ steps.get-version.outputs.version }}" > CHANGELOG.md
        echo "" >> CHANGELOG.md
        
        # Get commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -z "$LAST_TAG" ]; then
          echo "#### Changes:" >> CHANGELOG.md
          git log --pretty=format:"- %s (%h)" -n 20 >> CHANGELOG.md
        else
          echo "#### Changes since $LAST_TAG:" >> CHANGELOG.md
          git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG.md
        fi
        
        echo "" >> CHANGELOG.md
        echo "#### 🐳 Docker Images:" >> CHANGELOG.md
        echo "All services are available as Docker images tagged with \`${{ steps.get-version.outputs.version }}\`" >> CHANGELOG.md
        
        cat CHANGELOG.md
    
    - name: 🎉 Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get-version.outputs.version }}
        release_name: Release ${{ steps.get-version.outputs.version }}
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
      continue-on-error: true

  build-and-publish:
    name: 🐳 Build & Publish Docker Images
    runs-on: ubuntu-latest
    needs: create-release
    
    strategy:
      matrix:
        service:
          - { name: 'user-service', context: './services/user-service/src/UserService' }
          - { name: 'product-service', context: './services/product-service/src/ProductService' }
          - { name: 'book-service', context: './services/book-service/src/BookService' }
          - { name: 'reservation-service', context: './services/reservation-service/src/ReservationService' }
          - { name: 'cart-service', context: './services/cart-service/src/CartService' }
          - { name: 'order-service', context: './services/OrderService' }
          - { name: 'analytics-service', context: './services/AnalyticsService' }
          - { name: 'gateway', context: './services/gateway' }
          - { name: 'frontend', context: './services/frontend' }
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 🔐 Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
    
    - name: 📝 Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/feane-${{ matrix.service.name }}
        tags: |
          type=semver,pattern={{version}},value=${{ needs.create-release.outputs.version }}
          type=semver,pattern={{major}}.{{minor}},value=${{ needs.create-release.outputs.version }}
          type=semver,pattern={{major}},value=${{ needs.create-release.outputs.version }}
          type=raw,value=latest
    
    - name: 🔨 Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.service.context }}
        file: ${{ matrix.service.context }}/Dockerfile
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ needs.create-release.outputs.version }}
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          VCS_REF=${{ github.sha }}
      continue-on-error: true
    
    - name: ✅ Image published
      run: |
        echo "✅ Published ${{ matrix.service.name }} image for version ${{ needs.create-release.outputs.version }}"

  release-artifacts:
    name: 📦 Build Release Artifacts
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 📦 Restore dependencies
      run: dotnet restore
    
    - name: 🔨 Build solution
      run: dotnet build --configuration Release --no-restore /p:Version=${{ needs.create-release.outputs.version }}
    
    - name: 📦 Publish artifacts
      run: |
        mkdir -p ./artifacts
        
        # Publish each service
        services=("user-service" "product-service" "book-service" "reservation-service" "cart-service" "OrderService" "AnalyticsService" "gateway" "frontend")
        
        for service in "${services[@]}"; do
          if [ "$service" == "user-service" ] || [ "$service" == "product-service" ] || [ "$service" == "book-service" ] || [ "$service" == "reservation-service" ] || [ "$service" == "cart-service" ]; then
            project_path="services/$service/src/${service^}/$(echo $service | sed 's/-//g' | sed 's/service/Service/').csproj"
          elif [ "$service" == "gateway" ]; then
            project_path="services/gateway/FeaneGateway.csproj"
          elif [ "$service" == "frontend" ]; then
            project_path="services/frontend/Feane.Frontend.csproj"
          else
            project_path="services/$service/$service.csproj"
          fi
          
          echo "Building $service..."
        done
    
    - name: 📊 Release summary
      run: |
        echo "### 📦 Release ${{ needs.create-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Release artifacts have been generated." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 🐳 Docker Images:" >> $GITHUB_STEP_SUMMARY
        echo "- User Service" >> $GITHUB_STEP_SUMMARY
        echo "- Product Service" >> $GITHUB_STEP_SUMMARY
        echo "- Book Service" >> $GITHUB_STEP_SUMMARY
        echo "- Reservation Service" >> $GITHUB_STEP_SUMMARY
        echo "- Cart Service" >> $GITHUB_STEP_SUMMARY
        echo "- Order Service" >> $GITHUB_STEP_SUMMARY
        echo "- Analytics Service" >> $GITHUB_STEP_SUMMARY
        echo "- API Gateway" >> $GITHUB_STEP_SUMMARY
        echo "- Frontend" >> $GITHUB_STEP_SUMMARY

  release-complete:
    name: ✅ Release Complete
    runs-on: ubuntu-latest
    needs: [create-release, build-and-publish, release-artifacts]
    if: always()
    
    steps:
    - name: 🎉 Release summary
      run: |
        echo "### 🎉 Release ${{ needs.create-release.outputs.version }} Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "The release has been created and all artifacts have been published." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 📦 What's included:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Docker images for all services" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ GitHub release with changelog" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Tagged version in Git" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### 🚀 Next steps:" >> $GITHUB_STEP_SUMMARY
        echo "- Deploy to staging environment" >> $GITHUB_STEP_SUMMARY
        echo "- Run smoke tests" >> $GITHUB_STEP_SUMMARY
        echo "- Promote to production if tests pass" >> $GITHUB_STEP_SUMMARY
