name: Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: |
          for project in services/*/src/*.csproj; do
            dotnet restore "$project"
          done
      - name: Test
        run: |
          for testProject in $(find services -path "*Tests.csproj"); do
            dotnet test "$testProject"
          done
