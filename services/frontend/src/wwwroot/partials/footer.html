    <style>
        /* Scoped variables (только внутри футера) */
        .feane-footer {
            --bg: #121827;
            --panel: #1b2130;
            --ink: #f5f7ff;
            --muted: #c9cfdb;
            --line: rgba(255, 255, 255, .08);
            --accent: #ffbe33;
            --accent-2: #ff7a1a;
            --radius: 14px;
        }

        .feane-footer {
            background: linear-gradient(180deg, rgba(255, 255, 255, .02), rgba(255, 255, 255, .01)), var(--bg);
            color: var(--ink);
            padding: 44px 20px 22px;
            font-family: "Poppins", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            border-top: 1px solid var(--line);
        }

        .footer-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 28px;
        }

        .footer-col {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 18px;
        }

        .footer-col.center {
            text-align: center;
        }

        .footer-title {
            margin: 0 0 12px;
            color: var(--accent);
            font-size: 18px;
            font-weight: 800;
            letter-spacing: .2px;
        }

        .footer-links {
            display: grid;
            gap: 10px;
            font-style: normal; /* address reset */
        }

        .footer-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--ink);
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 10px;
            transition: background .18s ease, color .18s ease, transform .06s ease;
        }

        .footer-link:hover {
            background: rgba(255, 255, 255, .04);
            color: #fff;
        }

        .footer-logo {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(180deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 900;
            font-size: 24px;
            letter-spacing: .4px;
            margin-bottom: 8px;
        }

        .footer-text {
            margin: 0 0 14px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.65;
        }

        .footer-social {
            display: inline-flex;
            gap: 12px;
        }

        .footer-social a {
            width: 36px;
            height: 36px;
            display: inline-grid;
            place-items: center;
            color: var(--ink);
            background: rgba(255, 255, 255, .06);
            border: 1px solid var(--line);
            border-radius: 50%;
            text-decoration: none;
            transition: transform .12s ease, background .18s ease;
        }

        .footer-social a:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, .12);
        }

        .hours {
            list-style: none;
            margin: 0;
            padding: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .footer-bottom {
            max-width: 1200px;
            margin: 22px auto 0;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            text-align: center;
            color: #cdd3de;
            font-size: 14px;
        }

        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            color: var(--accent);
        }

        /* Доступность: focus-visible */
        .feane-footer a:focus-visible {
            outline: 3px solid rgba(255, 190, 51, .45);
            outline-offset: 2px;
            border-radius: 10px;
        }

        /* Адаптив */
        @media (max-width: 900px) {
            .footer-inner {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {
            .footer-inner {
                grid-template-columns: 1fr;
            }

            .footer-col.center {
                text-align: left;
            }

            .footer-social {
                margin-top: 8px;
            }
        }

        /* Предпочтение пользователя: уменьшить анимацию */
        @media (prefers-reduced-motion: reduce) {
            .footer-link, .footer-social a {
                transition: none;
            }
        }
    </style>

    <script>
        (function () {
            const root = document.currentScript.closest('footer');
            const yearNode = root && root.querySelector('#displayYear');
            if (yearNode) yearNode.textContent = new Date().getFullYear();
        })();
    </script>
