<section class="food-section" data-add-to-cart-url="/api/cart/add" data-menu-endpoint="/api/dishes">
    <div class="food-container">
        <div class="food-heading">
            <h2>Our Menu</h2>
        </div>

        <div class="food-alert d-none" id="food-feedback" role="alert"></div>

        <ul class="food-filters">
            <li class="active" data-filter="*">All</li>
            <li data-filter=".burger">Burger</li>
            <li data-filter=".pizza">Pizza</li>
            <li data-filter=".pasta">Pasta</li>
            <li data-filter=".fries">Fries</li>
        </ul>

        <div aria-busy="false" aria-live="polite" class="food-grid">
            <p class="food-loading">Menu is loading…</p>
        </div>
    </div>

    <style>
        /* ===== Стили только для food-section ===== */

        .food-section {
            background-color: #141824;
            color: #f8f9fb;
            font-family: "Poppins", sans-serif;
            padding: 60px 20px;
        }

        .food-container {
            max-width: 1100px;
            margin: 0 auto;
            text-align: center;
        }

        .food-heading h2 {
            color: #ffbe33;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }

        /* === Фильтры === */
        .food-filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            list-style: none;
            margin: 0 0 36px 0;
            padding: 0;
        }

        .food-filters li {
            background-color: #1f2533;
            color: #f3f5fa;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .food-filters li:hover {
            background-color: #2c3448;
        }

        .food-filters li.active {
            background: linear-gradient(180deg, #ffbe33, #ff7a1a);
            color: #1b1103;
            transform: scale(1.05);
        }

        /* === Карточки блюд === */
        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .food-card {
            background-color: #1b2130;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-align: left;
        }

        .food-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 26px rgba(0, 0, 0, 0.45);
        }

        .food-card .img-box {
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .food-card .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .food-card:hover .img-box img {
            transform: scale(1.05);
        }

        .food-card .detail-box {
            padding: 16px 18px 20px;
        }

        .food-card .name {
            color: #ffbe33;
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 6px 0;
        }

        .food-card .description {
            color: #d0d4de;
            font-size: 14px;
            margin-bottom: 12px;
            min-height: 40px;
        }

        .food-card .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .food-card .price {
            font-weight: 700;
            color: #ffffff;
            font-size: 16px;
        }

        .food-card .cart-icon {
            background: linear-gradient(180deg, #ffbe33, #ff7a1a);
            border-radius: 50%;
            padding: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #1b1103;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(255, 190, 51, 0.35);
        }

        .food-card .cart-icon:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 14px rgba(255, 190, 51, 0.5);
        }

        .food-loading {
            grid-column: 1 / -1;
            text-align: center;
            color: #b0b6c5;
            font-size: 16px;
            margin: 0;
        }

        /* === Feedback === */
        .food-alert {
            background-color: #1f2738;
            color: #f8f9fb;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .food-alert.d-none {
            display: none !important;
        }

        .food-card.hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .food-card .detail-box {
                padding: 14px;
            }

            .food-card .name {
                font-size: 16px;
            }

            .food-card .description {
                font-size: 13px;
            }

            .food-card .price {
                font-size: 15px;
            }
        }
    </style>
</section>

<!-- Шаблон карточки -->
<template id="food-card-template">
    <div class="food-card all">
        <div class="img-box">
            <img alt="Dish image" src="/images/default.png">
        </div>
        <div class="detail-box">
            <h5 class="name">Dish name</h5>
            <p class="description">Dish description</p>
            <div class="options">
                <h6 class="price">$0.00</h6>
                <a class="cart-icon add-to-cart" data-quantity="1" href="#" title="Add to cart">
                    <svg class="feather feather-shopping-cart" fill="none" height="20"
                         stroke="currentColor" stroke-linecap="round"
                         stroke-linejoin="round" stroke-width="2"
                         viewBox="0 0 24 24" width="20"
                         xmlns="http://www.w3.org/2000/svg">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                </a>
            </div>
        </div>
    </div>
</template>

<script src="/js/food-section.js"></script>
