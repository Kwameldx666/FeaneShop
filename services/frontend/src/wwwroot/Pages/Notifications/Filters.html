<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
    <meta content="" name="keywords"/>
    <meta content="" name="description"/>
    <meta content="" name="author"/>
    <link href="/images/favicon.png" rel="shortcut icon" type="">
    <title>Feane</title>
    <link href="/css/bootstrap.css" rel="stylesheet" type="text/css"/>
    <link href="/css/style.css" rel="stylesheet"/>
    <link href="/css/responsive.css" rel="stylesheet"/>
    <link href="/css/navbar.css" rel="stylesheet"/>
</head>
<body class="sub_page">
<div data-include="/partials/navbar.html"></div>

<main class="container py-5">
    <h1 class="mb-4">Manage Filters</h1>

    <form class="card card-body shadow-sm mb-4">
        <label class="form-label" for="userInput">Generate filters with AI</label>
        <textarea class="form-control" id="userInput" placeholder="Enter what you like (e.g., 'I enjoy hobbies, work, and news')"
                  rows="3"></textarea>
        <button class="btn btn-primary mt-3" disabled type="submit">Generate Filters</button>
    </form>

    <form class="card card-body shadow-sm mb-4">
        <label class="form-label" for="filterName">Add a single filter</label>
        <input class="form-control" id="filterName" placeholder="I like sports" type="text"/>
        <button class="btn btn-outline-primary mt-3" disabled type="submit">Add Filter</button>
    </form>

    <h2 class="h4">Current Filters</h2>
    <ul class="list-group list-group-numbered mb-4">
        <li class="list-group-item">Loyal customers (ID: loyal-customers)</li>
        <li class="list-group-item">Vegetarian options (ID: vegetarian)</li>
        <li class="list-group-item">Weekend offers (ID: weekend)</li>
    </ul>

    <a class="btn btn-link" href="/notifications">Back to Notifications</a>
</main>

<div data-include="/partials/footer.html"></div>

</body>
</html>
