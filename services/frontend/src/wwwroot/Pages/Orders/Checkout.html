<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="http://localhost:5000" name="gateway-origin">
    <title>Checkout - Feane Restaurant</title>
    <link href="/images/favicon.png" rel="shortcut icon" type="image/png"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/bootstrap.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
        }

        .page-content {
            padding: 40px 20px;
        }

        .checkout-container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .checkout-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .checkout-header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .checkout-steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            padding: 0 50px;
        }

        .step {
            text-align: center;
            position: relative;
            flex: 1;
        }

        .step-number {
            width: 50px;
            height: 50px;
            background: #ddd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-weight: 700;
            color: white;
        }

        .step.active .step-number {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #333;
        }

        .cart-items {
            margin-bottom: 30px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .cart-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 20px;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .item-price {
            color: #667eea;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-control {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .order-summary {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .summary-row.total {
            border-top: 2px solid #ddd;
            padding-top: 15px;
            margin-top: 15px;
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .btn-place-order {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin-top: 20px;
        }

        .btn-place-order:hover {
            transform: scale(1.02);
        }

        .btn-place-order:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-back {
            display: inline-block;
            padding: 12px 30px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 20px;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="page-content">
    <div class="checkout-container">
        <div class="checkout-header">
            <h1>🛒 Checkout</h1>
            <p class="text-muted">Complete your order</p>
        </div>

        <div class="checkout-steps">
            <div class="step active">
                <div class="step-number">1</div>
                <div>Review Items</div>
            </div>
            <div class="step active">
                <div class="step-number">2</div>
                <div>Delivery Info</div>
            </div>
            <div class="step">
                <div class="step-number">3</div>
                <div>Confirm</div>
            </div>
        </div>

        <div id="alert-container"></div>
        <div class="loading" id="loading" style="display: none;">Processing...</div>

        <div id="checkout-form">
            <div class="section-title">📦 Order Items</div>
            <div class="cart-items" id="cart-items"></div>

            <div class="section-title">🚚 Delivery Information</div>
            <form id="orderForm">
                <div class="form-group">
                    <label for="deliveryAddress">Delivery Address *</label>
                    <textarea class="form-control" id="deliveryAddress" name="deliveryAddress"
                              placeholder="Enter your full delivery address" required></textarea>
                </div>

                <div class="form-group">
                    <label for="notes">Order Notes (Optional)</label>
                    <textarea class="form-control" id="notes" name="notes"
                              placeholder="Any special instructions?"></textarea>
                </div>

                <div class="order-summary">
                    <div class="section-title">Order Summary</div>
                    <div class="summary-row">
                        <span>Subtotal (<span id="itemCount">0</span> items)</span>
                        <span id="subtotal">0.00 LEI</span>
                    </div>
                    <div class="summary-row">
                        <span>Delivery Fee</span>
                        <span class="text-success">FREE</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total</span>
                        <span id="total">0.00 LEI</span>
                    </div>
                </div>

                <button class="btn-place-order" id="placeOrderBtn" type="submit">
                    Proceed to Payment →
                </button>

                <a class="btn-back" href="/cart/cart">← Back to Cart</a>
            </form>
        </div>
    </div>
</div>

<script>
    // Load navbar
    fetch('/partials/navbar.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('navbar-placeholder').innerHTML = html;
        });
</script>

<script src="/js/gateway-client.js"></script>
<script>
    const gatewayClient = new GatewayClient();
    let cartData = null;

    async function loadCart() {
        try {
            const response = await gatewayClient.get('/api/cart');

            if (response.success && response.items && response.items.length > 0) {
                cartData = response;
                renderCartItems(response.items);
                updateSummary(response.items, response.totalPrice);
            } else {
                showAlert('Your cart is empty. Add some items first!', 'danger');
                setTimeout(() => window.location.href = '/home/menu', 2000);
            }
        } catch (error) {
            console.error('Error loading cart:', error);

            // Check if error is 401 Unauthorized
            if (error.message === 'Unauthorized') {
                showAlert('Please login to continue with checkout.', 'danger');
                setTimeout(() => {
                    window.location.href = '/account/authentication?returnUrl=' + encodeURIComponent(window.location.pathname);
                }, 1500);
            } else {
                showAlert('Failed to load cart. Please try again.', 'danger');
            }
        }
    }

    function renderCartItems(items) {
        const container = document.getElementById('cart-items');
        container.innerHTML = items.map(item => `
                <div class="cart-item">
                    <img src="${item.productImageUrl || '/images/default-food.jpg'}" alt="${item.productName}">
                    <div class="item-details">
                        <div class="item-name">${item.productName}</div>
                        <div class="item-price">$${item.unitPrice.toFixed(2)} × ${item.quantity}</div>
                    </div>
                    <div class="item-price" style="font-size: 20px; font-weight: 700;">
                        $${item.totalPrice.toFixed(2)}
                    </div>
                </div>
            `).join('');
    }

    function updateSummary(items, totalPrice) {
        document.getElementById('itemCount').textContent = items.length;
        document.getElementById('subtotal').textContent = `$${totalPrice.toFixed(2)}`;
        document.getElementById('total').textContent = `$${totalPrice.toFixed(2)}`;
    }

    async function placeOrder(event) {
        event.preventDefault();

        const deliveryAddress = document.getElementById('deliveryAddress').value.trim();
        const notes = document.getElementById('notes').value.trim();

        if (!deliveryAddress) {
            showAlert('Please enter a delivery address.', 'danger');
            return;
        }

        if (!cartData || !cartData.items || cartData.items.length === 0) {
            showAlert('Your cart is empty.', 'danger');
            return;
        }

        // Prepare order data
        const orderData = {
            deliveryAddress: deliveryAddress,
            notes: notes || null,
            items: cartData.items.map(item => ({
                productId: item.productId,
                productName: item.productName,
                productImageUrl: item.productImageUrl,
                unitPrice: item.unitPrice,
                quantity: item.quantity
            }))
        };

        // Redirect to payment page with order data
        const dataParam = encodeURIComponent(JSON.stringify(orderData));
        window.location.href = `/orders/payment?data=${dataParam}`;
    }

    async function clearCart() {
        try {
            for (const item of cartData.items) {
                await gatewayClient.delete(`/api/cart/items/${item.id}`);
            }
        } catch (error) {
            console.error('Error clearing cart:', error);
        }
    }

    function showAlert(message, type) {
        const alertContainer = document.getElementById('alert-container');
        alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        setTimeout(() => alertContainer.innerHTML = '', 5000);
    }

    // Initialize
    document.getElementById('orderForm').addEventListener('submit', placeOrder);
    loadCart();
</script>
</body>
</html>
