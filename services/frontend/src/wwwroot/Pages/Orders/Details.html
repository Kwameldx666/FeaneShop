<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="http://localhost:5000" name="gateway-origin">
    <title>Order Details - Feane Restaurant</title>
    <link href="/images/favicon.png" rel="shortcut icon" type="image/png"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/bootstrap.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
        }

        .page-content {
            padding: 20px 0;
        }

        .details-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .page-header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-header h1 {
            margin: 0;
            color: #333;
            font-weight: 700;
        }

        .order-status-badge {
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 16px;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-confirmed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-preparing {
            background: #cce5ff;
            color: #004085;
        }

        .status-ready {
            background: #d4edda;
            color: #155724;
        }

        .status-delivered {
            background: #d6d8db;
            color: #383d41;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .content-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .info-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .order-item {
            display: flex;
            align-items: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .order-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            margin-right: 20px;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .item-meta {
            color: #666;
            margin-bottom: 5px;
        }

        .item-notes {
            font-style: italic;
            color: #999;
            font-size: 14px;
        }

        .item-price {
            text-align: right;
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
        }

        .order-summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 15px;
            color: white;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .summary-row.total {
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            padding-top: 15px;
            margin-top: 15px;
            font-size: 28px;
            font-weight: 700;
        }

        .btn-back {
            display: inline-block;
            padding: 15px 30px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 20px;
            transition: transform 0.2s ease;
        }

        .btn-back:hover {
            transform: scale(1.05);
            background: #5a6268;
        }

        .btn-cancel {
            display: inline-block;
            padding: 15px 30px;
            background: #ff4d4d;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 20px;
            margin-left: 10px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .btn-cancel:hover {
            transform: scale(1.05);
            background: #ff3333;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: white;
            font-size: 18px;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="page-content">
    <div class="details-container">
        <div id="alert-container"></div>
        <div class="loading" id="loading">Loading order details...</div>
        <div id="order-content" style="display: none;">
            <div class="page-header">
                <div>
                    <h1 id="orderTitle">Order #...</h1>
                    <p class="text-muted mb-0" id="orderDate"></p>
                </div>
                <div class="order-status-badge" id="orderStatus"></div>
            </div>

            <div class="content-card">
                <div class="section-title">📋 Order Information</div>
                <div class="info-grid" id="orderInfo"></div>
            </div>

            <div class="content-card">
                <div class="section-title">📦 Order Items</div>
                <div id="orderItems"></div>
            </div>

            <div class="order-summary">
                <div class="section-title" style="color: white;">💰 Order Summary</div>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Delivery Fee</span>
                    <span>FREE</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="total">$0.00</span>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <a class="btn-back" href="/orders">← Back to Orders</a>
                <button class="btn-cancel" id="cancelBtn" style="display: none;">Cancel Order</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Load navbar
    fetch('/partials/navbar.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('navbar-placeholder').innerHTML = html;
        });
</script>

<script src="/js/gateway-client.js"></script>
<script>
    const gatewayClient = new GatewayClient();
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('id');

    if (!orderId) {
        showAlert('Order ID is required', 'danger');
        setTimeout(() => window.location.href = '/orders', 2000);
    } else {
        loadOrderDetails();
    }

    async function loadOrderDetails() {
        try {
            const response = await gatewayClient.get(`/api/orders/${orderId}`);

            document.getElementById('loading').style.display = 'none';
            document.getElementById('order-content').style.display = 'block';

            if (response.success && response.order) {
                renderOrder(response.order);
            } else {
                showAlert('Order not found', 'danger');
                setTimeout(() => window.location.href = '/orders', 2000);
            }
        } catch (error) {
            console.error('Error loading order:', error);

            // Check if error is 401 Unauthorized
            if (error.message === 'Unauthorized') {
                document.getElementById('loading').innerHTML =
                    '<div class="alert alert-danger">Please login to view order details.</div>';
                setTimeout(() => {
                    window.location.href = '/account/authentication?returnUrl=' + encodeURIComponent(window.location.pathname + window.location.search);
                }, 1500);
            } else {
                document.getElementById('loading').innerHTML =
                    '<div class="alert alert-danger">Failed to load order details.</div>';
            }
        }
    }

    function renderOrder(order) {
        // Header
        document.getElementById('orderTitle').textContent =
            `Order #${order.id.substring(0, 8).toUpperCase()}`;
        document.getElementById('orderDate').textContent =
            `Placed on ${new Date(order.createdAt).toLocaleDateString('en-US', {
                year: 'numeric', month: 'long', day: 'numeric',
                hour: '2-digit', minute: '2-digit'
            })}`;

        const statusBadge = document.getElementById('orderStatus');
        statusBadge.textContent = order.status;
        statusBadge.className = `order-status-badge status-${order.status.toLowerCase()}`;

        // Order Info
        const infoHtml = `
                ${order.userName ? `
                <div class="info-item">
                    <div class="info-label">Customer</div>
                    <div class="info-value">${order.userName}</div>
                </div>` : ''}
                ${order.userEmail ? `
                <div class="info-item">
                    <div class="info-label">Email</div>
                    <div class="info-value">${order.userEmail}</div>
                </div>` : ''}
                ${order.deliveryAddress ? `
                <div class="info-item">
                    <div class="info-label">Delivery Address</div>
                    <div class="info-value">${order.deliveryAddress}</div>
                </div>` : ''}
                ${order.notes ? `
                <div class="info-item">
                    <div class="info-label">Order Notes</div>
                    <div class="info-value">${order.notes}</div>
                </div>` : ''}
                <div class="info-item">
                    <div class="info-label">Updated</div>
                    <div class="info-value">${new Date(order.updatedAt).toLocaleDateString('en-US', {
            month: 'short', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
        })}</div>
                </div>
            `;
        document.getElementById('orderInfo').innerHTML = infoHtml;

        // Order Items
        const itemsHtml = order.items.map(item => `
                <div class="order-item">
                    <img src="${item.productImageUrl || '/images/default-food.jpg'}" alt="${item.productName}">
                    <div class="item-details">
                        <div class="item-name">${item.productName}</div>
                        <div class="item-meta">$${item.unitPrice.toFixed(2)} × ${item.quantity}</div>
                        ${item.notes ? `<div class="item-notes">Note: ${item.notes}</div>` : ''}
                    </div>
                    <div class="item-price">$${item.totalPrice.toFixed(2)}</div>
                </div>
            `).join('');
        document.getElementById('orderItems').innerHTML = itemsHtml;

        // Summary
        document.getElementById('subtotal').textContent = `$${order.totalAmount.toFixed(2)}`;
        document.getElementById('total').textContent = `$${order.totalAmount.toFixed(2)}`;

        // Cancel button
        if (order.status === 'Pending' || order.status === 'Confirmed') {
            const cancelBtn = document.getElementById('cancelBtn');
            cancelBtn.style.display = 'inline-block';
            cancelBtn.onclick = () => cancelOrder(order.id);
        }
    }

    async function cancelOrder(orderId) {
        if (!confirm('Are you sure you want to cancel this order?')) {
            return;
        }

        try {
            const response = await gatewayClient.delete(`/api/orders/${orderId}`);
            if (response.success) {
                showAlert('Order cancelled successfully!', 'success');
                setTimeout(() => window.location.reload(), 1500);
            } else {
                showAlert('Failed to cancel order.', 'danger');
            }
        } catch (error) {
            console.error('Error cancelling order:', error);
            showAlert('Failed to cancel order. Please try again.', 'danger');
        }
    }

    function showAlert(message, type) {
        const alertContainer = document.getElementById('alert-container');
        alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        setTimeout(() => alertContainer.innerHTML = '', 5000);
    }
</script>
</body>
</html>
