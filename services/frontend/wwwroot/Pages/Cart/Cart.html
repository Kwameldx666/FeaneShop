<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="shortcut icon" href="/images/favicon.png" type="image/png" />
    <title>Feane — Shopping Cart</title>

    <!-- Базовые стили темы -->
    <link rel="stylesheet" href="/css/bootstrap.css" />
    <link rel="stylesheet" href="/css/font-awesome.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/navbar.css" />

    <!-- Стили страницы (опционально свой файл) -->
    <link rel="stylesheet" href="/css/cart.css" />
</head>
<body class="sub_page">
    <!-- Navbar (partial) -->
    <div data-include="/partials/navbar.html"></div>

    <!-- Контент -->
    <main class="container cart-container py-4"
          data-cart-endpoint="/api/cart"          
        data-checkout-url="/Pages/Payment/Checkout.html"> 
    <h1 class="mb-4">Shopping Cart</h1>

    <div id="cart-error" class="alert alert-warning d-none" role="alert"></div>

    <div id="cart-table-wrap" class="table-responsive d-none">
      <table class="table table-striped align-middle mb-0">
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col" class="text-center">Price</th>
            <th scope="col" class="text-center">Quantity</th>
            <th scope="col" class="text-center">Total</th>
            <th scope="col" class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="cart-table-body"><!-- rows via JS --></tbody>
      </table>
    </div>

    <div id="cart-empty" class="alert alert-info d-none" role="alert">
      Your cart is empty.
    </div>

    <div id="cart-cta" class="d-flex justify-content-between align-items-center mt-4 d-none">
      <h3 class="mb-0">Total: <span id="cart-total-amount">$0.00</span></h3>
      <a id="pay-now-btn" class="btn btn-primary" href="#">Pay Now</a>
    </div>

    <div id="cart-browse" class="mt-3 d-none">
      <a href="/Pages/Dish/Index.html" class="btn btn-primary">Browse menu</a>
    </div>
  </main>

    <!-- Footer (partial) -->
    <div data-include="/partials/footer.html"></div>

    <!-- Скрипты -->
    <script src="/js/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="/js/bootstrap.js"></script>

    <!-- Лоадер partial’ов -->
    <script src="/js/partials-loader.js"></script>

    <!-- Логика корзины -->
    <script src="/js/cart.js"></script>

    <!-- Общие эффекты темы -->
    <script src="/js/custom.js"></script>
</body>
</html>
