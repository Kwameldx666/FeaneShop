<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link rel="shortcut icon" href="/images/favicon.png" type="image/png">
  <title>Feane - Book a Table</title>
  <link rel="stylesheet" type="text/css" href="/css/bootstrap.css" />
  <link rel="stylesheet" href="/css/reservation-book.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
</head>
<body>
  <div data-include="/partials/navbar.html"></div>

  <main class="container py-5">
    <div class="row g-4">
      <div class="col-lg-7">
        <h1 class="mb-4">Reserve a table</h1>
        <div id="reservation-feedback" class="alert d-none" role="alert"></div>
        <form class="booking-form" action="http://localhost:5000/api/reservations" method="post"
          data-gateway-endpoint="/api/reservations">
          <div class="mb-3">
            <label for="reservationName" class="form-label">Name</label>
            <input type="text" id="reservationName" name="Name" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="reservationEmail" class="form-label">Email</label>
            <input type="email" id="reservationEmail" name="Email" class="form-control" required />
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="reservationPhone" class="form-label">Phone</label>
              <input type="tel" id="reservationPhone" name="Phone" class="form-control" />
            </div>
            <div class="col-md-6 mb-3">
              <label for="reservationGuests" class="form-label">Number of guests</label>
              <input type="number" id="reservationGuests" name="NumberOfPeople" class="form-control" min="1" value="2" />
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="reservationDate" class="form-label">Date</label>
              <input type="date" id="reservationDate" name="ReservationDate" class="form-control" required />
            </div>
            <div class="col-md-6 mb-3">
              <label for="reservationTime" class="form-label">Time</label>
              <input type="time" id="reservationTime" name="ReservationTime" class="form-control" required />
            </div>
          </div>
          <div class="mb-3">
            <label for="reservationBudget" class="form-label">Budget per guest (optional)</label>
            <input type="number" step="0.01" id="reservationBudget" name="BudgetPerGuest" class="form-control" />
          </div>
          <div class="mb-3">
            <label for="reservationMessage" class="form-label">Special requests</label>
            <textarea id="reservationMessage" name="Message" class="form-control" rows="3"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Book now</button>
        </form>
      </div>
      <div class="col-lg-5">
        <div class="map-card">
          <div id="map" class="map"></div>
          <p class="mt-3 mb-0">Find us at 123 Flavor Street, Chisinau. We look forward to hosting you!</p>
        </div>
      </div>
    </div>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/js/jquery-3.4.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
  <script src="/js/bootstrap.js"></script>
  <script src="/js/partials-loader.js"></script>
  <script src="/js/gateway-client.js"></script>
  <script src="/js/reservation-book.js"></script>
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"></script>
</body>
</html>
