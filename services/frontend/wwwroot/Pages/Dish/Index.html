<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
    <title>Feane · Dishes</title>

    <style>
        /* ===== Стили только для этой страницы ===== */

        body.dish-admin-page {
            background-color: #141824;
            color: #f8f9fb;
            font-family: "Poppins", sans-serif;
            margin: 0;
            padding: 0;
        }

        .dish-admin-page .admin-container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
            background-color: #1b2130;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            padding: 30px;
        }

        .dish-admin-page .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .dish-admin-page .admin-header h2 {
            color: #ffbe33;
            margin: 0;
            font-size: 26px;
            font-weight: 700;
        }

        .dish-admin-page .add-dish-btn {
            background: linear-gradient(180deg, #ffbe33, #ff7a1a);
            color: #1b1103;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s ease;
            box-shadow: 0 4px 10px rgba(255, 190, 51, 0.35);
        }

        .dish-admin-page .add-dish-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .dish-admin-page .table-wrap {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: #232a3b;
        }

        .dish-admin-page table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 8px;
            overflow: hidden;
        }

        .dish-admin-page thead {
            background-color: #2c3448;
        }

        .dish-admin-page th,
        .dish-admin-page td {
            padding: 14px 16px;
            text-align: left;
        }

        .dish-admin-page th {
            color: #ffbe33;
            font-weight: 700;
            font-size: 14px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.15);
        }

        .dish-admin-page td {
            color: #eaeef7;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            vertical-align: middle;
            font-size: 15px;
        }

        .dish-admin-page tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .dish-admin-page .thumb {
            display: block;
            width: 80px;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin: 0 auto;
        }

        .dish-admin-page .actions-cell,
        .dish-admin-page .table-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            white-space: nowrap;
        }

        .dish-admin-page .edit-btn,
        .dish-admin-page .delete-btn {
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .dish-admin-page .edit-btn {
            background-color: #007bff;
            color: #fff;
        }

        .dish-admin-page .edit-btn:hover {
            background-color: #0a84ff;
        }

        .dish-admin-page .delete-btn {
            background-color: #e55353;
            color: #fff;
        }

        .dish-admin-page .delete-btn:hover {
            background-color: #ff6666;
        }

        @media (max-width: 700px) {
            .dish-admin-page .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .dish-admin-page .actions-cell,
            .dish-admin-page .table-actions {
                justify-content: flex-start;
                gap: 8px;
            }

            .dish-admin-page .thumb {
                width: 65px;
                height: 65px;
            }
        }
    </style>
</head>

<body class="dish-admin-page">
<!-- Navbar и footer автоматически подгружаются -->
<div data-include="/partials/navbar.html"></div>

<main class="admin-container"
      data-delete-template="/api/dishes/{id}"
      data-dishes-endpoint="/api/dishes">
    <div class="admin-header">
        <h2>Dishes List</h2>
        <a class="add-dish-btn" href="/dish/adddish">+ Add New Dish</a>
    </div>

    <div class="alert d-none" id="dish-feedback" role="alert"></div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Category</th>
                <th>Image</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="dish-table-body">
            <!-- пример -->
            <tr>
                <td>Classic Burger</td>
                <td>Juicy beef patty with cheddar cheese and lettuce.</td>
                <td>12.50 LEI</td>
                <td>Burger</td>
                <td><img alt="Classic Burger" class="thumb" src="/images/demo/burger.jpg"/></td>
                <td class="actions-cell">
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn">Delete</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div data-include="/partials/footer.html"></div>

<!-- ✅ Только нужные JS -->
<script src="/js/jquery-3.4.1.min.js"></script>
<script src="/js/gateway-client.js"></script>
<script src="/js/partials-loader.js"></script>
<script src="/js/dish-index.js"></script>
</body>
</html>
