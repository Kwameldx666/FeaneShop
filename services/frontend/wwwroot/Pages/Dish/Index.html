<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link rel="shortcut icon" href="/images/favicon.png" type="image/png">
  <title>Feane - Manage Dishes</title>
  <link rel="stylesheet" type="text/css" href="/css/bootstrap.css" />
  <link rel="stylesheet" href="/css/dish-index.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
</head>
<body>
  <div data-include="/partials/navbar.html"></div>

  <main class="container py-5 admin-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="mb-0">Menu Items</h1>
      <a class="btn btn-primary" href="/Pages/Dish/AddDish.html">Add dish</a>
    </div>
    <div id="dish-feedback" class="alert d-none" role="alert"></div>
    <div class="table-responsive">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Description</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr id="dish-row-1">
            <td>Delicious Pizza</td>
            <td>Pizza</td>
            <td>$20.00</td>
            <td>Stone-baked crust with fresh mozzarella.</td>
            <td class="text-end">
              <a class="btn btn-outline-secondary btn-sm" href="/Pages/Dish/EditDish.html">Edit</a>
            </td>
          </tr>
          <tr id="dish-row-2">
            <td>Juicy Burger</td>
            <td>Burger</td>
            <td>$15.00</td>
            <td>Beef patty with cheddar and house sauce.</td>
            <td class="text-end">
              <a class="btn btn-outline-secondary btn-sm" href="/Pages/Dish/EditDish.html">Edit</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/js/jquery-3.4.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
  <script src="/js/bootstrap.js"></script>
  <script src="/js/partials-loader.js"></script>
</body>
</html>
