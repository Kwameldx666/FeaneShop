<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="keywords" content="" />
  <meta name="description" content="" />
  <meta name="author" content="" />
  <link rel="shortcut icon" href="/images/favicon.png" type="">
  <title>Feane</title>
  <link rel="stylesheet" type="text/css" href="/css/bootstrap.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <link rel="stylesheet" href="/css/dish-form.css" />
</head>
<body class="sub_page">
  <div data-include="/partials/navbar.html"></div>

  <main class="form-container">
    <h2>Edit Dish</h2>
    <p class="text-muted">Static version of the MVC edit form. Populate fields with the dish data when integrating.</p>
    <form action="#" method="post" enctype="multipart/form-data">
      <div class="form-group">
        <label for="editDishName">Dish Name</label>
        <input id="editDishName" name="name" class="form-control" value="Margherita Pizza" required />
      </div>
      <div class="form-group">
        <label for="editDishDescription">Description</label>
        <textarea id="editDishDescription" name="description" class="form-control" rows="4" required>Classic pizza with mozzarella, tomatoes and basil.</textarea>
      </div>
      <div class="form-group">
        <label for="editDishPrice">Price</label>
        <input id="editDishPrice" name="price" type="number" step="0.01" min="0" class="form-control" value="12.00" required />
      </div>
      <div class="form-group">
        <label for="editDishCategory">Category</label>
        <select id="editDishCategory" name="category" class="form-control" required>
          <option value="">Select a category</option>
          <option value="burger">Burger</option>
          <option value="pizza" selected>Pizza</option>
          <option value="pasta">Pasta</option>
          <option value="fries">Fries</option>
        </select>
      </div>
      <div class="form-group">
        <label for="editDishImage">Image</label>
        <input type="file" id="editDishImage" name="imageFile" class="form-control" />
      </div>
      <button type="submit">Save</button>
    </form>
  </main>

  <div data-include="/partials/footer.html"></div>
</body>
</html>
