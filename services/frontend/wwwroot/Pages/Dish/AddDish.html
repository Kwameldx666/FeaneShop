<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link rel="shortcut icon" href="/images/favicon.png" type="image/png">
  <title>Feane - Add Dish</title>
  <link rel="stylesheet" type="text/css" href="/css/bootstrap.css" />
  <link rel="stylesheet" href="/css/dish-form.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
</head>
<body>
  <div data-include="/partials/navbar.html"></div>

  <main class="container py-5">
    <div class="form-container">
      <h2>Add new dish</h2>
      <form id="add-dish-form" action="http://localhost:5000/api/dishes" method="post" enctype="multipart/form-data">
        <div class="form-group">
          <label for="dishName">Dish name</label>
          <input type="text" id="dishName" name="Name" class="form-control" required />
        </div>
        <div class="form-group">
          <label for="dishDescription">Description</label>
          <textarea id="dishDescription" name="Description" class="form-control" required></textarea>
        </div>
        <div class="form-group">
          <label for="dishPrice">Price</label>
          <input type="number" step="0.01" id="dishPrice" name="Price" class="form-control" required />
        </div>
        <div class="form-group">
          <label for="dishCategory">Category</label>
          <select id="dishCategory" name="Category" class="form-control" required>
            <option value="">Select a category</option>
            <option value="burger">Burger</option>
            <option value="pizza">Pizza</option>
            <option value="pasta">Pasta</option>
            <option value="fries">Fries</option>
          </select>
        </div>
        <div class="form-group">
          <label for="dishImage">Image</label>
          <input type="file" id="dishImage" name="imageFile" class="form-control" />
        </div>
        <button type="submit" class="btn btn-primary">Add dish</button>
      </form>
    </div>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/js/jquery-3.4.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
  <script src="/js/bootstrap.js"></script>
  <script src="/js/partials-loader.js"></script>
</body>
</html>
