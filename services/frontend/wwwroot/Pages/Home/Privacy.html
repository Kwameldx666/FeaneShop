<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>

    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <link href="/images/favicon.png" rel="shortcut icon" type="image/png"/>
    <title>Feane — Privacy Policy</title>

    <!-- Базовые стили темы -->
    <link href="/css/bootstrap.css" rel="stylesheet"/>
    <link href="/css/font-awesome.min.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
    <link href="/css/responsive.css" rel="stylesheet"/>
    <link href="/css/navbar.css" rel="stylesheet"/>

    <!-- (опционально, если custom.js использует плагины) -->

          rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/jquery-nice-select/1.1.0/css/nice-select.min.css"

<body class="sub_page privacy-page">
<!-- Header / Navbar (partial) -->
<div data-include="/partials/navbar.html"></div>

<main class="container py-5" data-privacy-endpoint="/api/content/privacy">
    <header class="mb-4">
        <h1 class="h2 mb-2">Privacy Policy</h1>
        <p class="text-muted mb-2">
            This policy explains how Feane collects, uses, and protects your personal data when you visit our
            restaurant,
            use our services, or access this website.
        </p>
        <div class="text-muted small d-none" id="privacy-meta"></div>
    </header>

    <div class="row">
        <!-- Table of contents (auto) -->
        <aside class="col-lg-3 mb-4">
            <nav aria-label="Table of contents" class="privacy-toc card card-body d-none" id="privacy-toc"></nav>
        </aside>

        <!-- Content -->
        <section class="col-lg-9" id="privacy-content" tabindex="-1">
            <div class="alert alert-info mb-0">Loading privacy policy…</div>
        </section>
    </div>
</main>

<!-- Footer (partial) -->
<div data-include="/partials/footer.html"></div>

<noscript>
    <div class="container py-3">
        <div class="alert alert-warning mb-0">JavaScript is required to load this page content.</div>
    </div>
</noscript>

<script src="/js/gateway-client.js"></script>
