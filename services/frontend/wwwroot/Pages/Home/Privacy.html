<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="/images/favicon.png" type="image/png" />
    <title>Feane — Privacy Policy</title>

    <!-- Базовые стили темы -->
    <link rel="stylesheet" href="/css/bootstrap.css" />
    <link rel="stylesheet" href="/css/font-awesome.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/navbar.css" />

    <!-- (опционально, если custom.js использует плагины) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-nice-select/1.1.0/css/nice-select.min.css" />

    <!-- Стили страницы -->
    <link rel="stylesheet" href="/css/privacy.css" />
</head>
<body class="sub_page privacy-page">
    <!-- Header / Navbar (partial) -->
    <div data-include="/partials/navbar.html"></div>

    <main class="container py-5" data-privacy-endpoint="/api/content/privacy">
        <header class="mb-4">
            <h1 class="h2 mb-2">Privacy Policy</h1>
            <p class="text-muted mb-2">
                This policy explains how Feane collects, uses, and protects your personal data when you visit our restaurant,
                use our services, or access this website.
            </p>
            <div id="privacy-meta" class="text-muted small d-none"></div>
        </header>

        <div class="row">
            <!-- Table of contents (auto) -->
            <aside class="col-lg-3 mb-4">
                <nav id="privacy-toc" class="privacy-toc card card-body d-none" aria-label="Table of contents"></nav>
            </aside>

            <!-- Content -->
            <section class="col-lg-9" id="privacy-content" tabindex="-1">
                <div class="alert alert-info mb-0">Loading privacy policy…</div>
            </section>
        </div>
    </main>

    <!-- Footer (partial) -->
    <div data-include="/partials/footer.html"></div>

    <noscript>
        <div class="container py-3">
            <div class="alert alert-warning mb-0">JavaScript is required to load this page content.</div>
        </div>
    </noscript>

    <!-- Скрипты: порядок ВАЖЕН -->
    <script src="/js/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="/js/bootstrap.js"></script>

    <!-- Плагины (если нужны темой/custom.js) -->
    <script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-nice-select/1.1.0/jquery.nice-select.min.js"></script>

    <!-- Лоадер партиалов -->
    <script src="/js/partials-loader.js"></script>

    <!-- Заглушка gateway (на случай отсутствия реального) -->
    <script>
        window.feaneGateway = window.feaneGateway || {
            get: (u) => fetch(u, { credentials: 'include' })
                .then(r => r.ok ? r.json().catch(() => r.text()) : Promise.reject(new Error(r.statusText))),
        };
    </script>

    <!-- Логика страницы -->
    <script src="/js/home-privacy.js?v=1"></script>

    <!-- Общие эффекты темы -->
    <script src="/js/custom.js"></script>
</body>
</html>
