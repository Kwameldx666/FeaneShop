<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <link href="/images/favicon.png" rel="shortcut icon" type="image/png"/>
    <title>Feane — Our Menu</title>

    <style>
        /* ===== Стили только для этой страницы ===== */

        body.menu-page {
            background-color: #141824;
            color: #f8f9fb;
            font-family: "Poppins", sans-serif;
            margin: 0;
            padding: 0;
        }

        .food-section {
            padding: 60px 20px;
            text-align: center;
        }

        .food-section h2 {
            color: #ffbe33;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 40px;
        }

        .filters_menu {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            list-style: none;
            padding: 0;
            margin-bottom: 40px;
        }

        .filters_menu li {
            background-color: #1f2533;
            color: #f3f5fa;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .filters_menu li:hover {
            background-color: #2c3448;
        }

        .filters_menu li.active {
            background: linear-gradient(180deg, #ffbe33, #ff7a1a);
            color: #1b1103;
            transform: scale(1.05);
        }

        .filters-content .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
        }

        .box {
            background-color: #1b2130;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            text-align: left;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .box:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 26px rgba(0, 0, 0, 0.45);
        }

        .img-box {
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .box:hover .img-box img {
            transform: scale(1.05);
        }

        .detail-box {
            padding: 16px 18px 20px;
        }

        .detail-box .name {
            color: #ffbe33;
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 6px 0;
        }

        .detail-box .description {
            color: #d0d4de;
            font-size: 14px;
            margin-bottom: 12px;
            min-height: 40px;
        }

        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .options .price {
            font-weight: 700;
            color: #ffffff;
            font-size: 16px;
        }

        .cart-icon {
            background: linear-gradient(180deg, #ffbe33, #ff7a1a);
            border-radius: 50%;
            padding: 9px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #1b1103;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(255, 190, 51, 0.35);
        }

        .cart-icon:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 14px rgba(255, 190, 51, 0.5);
        }

        .food-alert {
            background-color: #1f2738;
            color: #f8f9fb;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .detail-box {
                padding: 14px;
            }

            .detail-box .name {
                font-size: 16px;
            }

            .detail-box .description {
                font-size: 13px;
            }

            .options .price {
                font-size: 15px;
            }
        }
    </style>
</head>

<body class="menu-page">
<!-- Navbar подгружается динамически -->
<div data-include="/partials/navbar.html"></div>

<!-- Шаблон карточки -->
<template id="food-card-template">
    <div class="box">
        <div class="img-box">
            <img alt="" src="/images/default.png">
        </div>
        <div class="detail-box">
            <h5 class="name">Dish name</h5>
            <p class="description">Dish description</p>
            <div class="options">
                <h6 class="price">0.00 LEI</h6>
                <a class="cart-icon add-to-cart" data-id="" data-name="" data-price="" data-quantity="1" href="#"
                   title="Add to cart">
                    <svg fill="none" height="20" stroke="currentColor"
                         stroke-linecap="round" stroke-linejoin="round"
                         stroke-width="2" viewBox="0 0 24 24"
                         width="20" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                </a>
            </div>
        </div>
    </div>
</template>

<!-- Секция меню -->
<section class="food-section"
         data-add-to-cart-url="/api/cart/add"
         data-currency="$"
         data-menu-endpoint="/api/dishes">
    <div class="heading_container">
        <h2>Our Menu</h2>
    </div>

    <div class="food-alert d-none" id="food-feedback" role="alert"></div>

    <ul aria-label="Menu filters" class="filters_menu">
        <li class="active" data-filter="*">All</li>
        <li data-filter=".burger">Burger</li>
        <li data-filter=".pizza">Pizza</li>
        <li data-filter=".pasta">Pasta</li>
        <li data-filter=".fries">Fries</li>
    </ul>

    <div class="filters-content">
        <div class="grid">
            <!-- карточки вставит JS -->
        </div>
    </div>
</section>

<!-- Footer подгружается динамически -->
<div data-include="/partials/footer.html"></div>

<!-- ✅ Только нужные JS -->
<script src="/js/jquery-3.4.1.min.js"></script>
<script src="/js/gateway-client.js"></script>
<script src="/js/partials-loader.js"></script>
<script src="/js/food-section.js?v=2"></script>
</body>
</html>
