<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link rel="shortcut icon" href="/images/favicon.png" type="image/png">
  <title>Feane - Addresses</title>
  <link rel="stylesheet" type="text/css" href="/css/bootstrap.css" />
  <link rel="stylesheet" href="/css/account-addresses.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
</head>
<body>
  <div data-include="/partials/navbar.html"></div>

  <main class="container py-5">
    <div class="row">
      <div class="col-lg-8">
        <h1 class="mb-4">Manage Address</h1>
        <form class="address-form" action="http://localhost:5000/api/account/address" method="post">
          <div id="addresses-feedback" class="alert d-none" role="alert"></div>
          <div class="mb-3">
            <label for="street" class="form-label">Street</label>
            <input type="text" class="form-control" id="street" name="Street" required />
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="city" class="form-label">City</label>
              <input type="text" class="form-control" id="city" name="City" required />
            </div>
            <div class="col-md-6 mb-3">
              <label for="country" class="form-label">Country</label>
              <input type="text" class="form-control" id="country" name="Country" required />
            </div>
          </div>
          <div class="mb-3">
            <label for="postalCode" class="form-label">Postal Code</label>
            <input type="text" class="form-control" id="postalCode" name="PostalCode" required />
          </div>
          <button type="submit" class="btn btn-primary">Save Address</button>
        </form>
      </div>
      <div class="col-lg-4">
        <aside class="card p-3">
          <h2 class="h5">Helpful tips</h2>
          <p class="mb-0">We use this address for deliveries and invoices. Make sure the information is up-to-date.</p>
        </aside>
      </div>
    </div>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/js/jquery-3.4.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
  <script src="/js/bootstrap.js"></script>
  <script src="/js/partials-loader.js"></script>
  <script src="/js/account-addresses.js"></script>
</body>
</html>
