<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <meta content="http://localhost:5000" name="gateway-origin"/>
    <link href="/images/favicon.png" rel="shortcut icon" type="image/png"/>
    <title>Feane — Контактные данные</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>

    <style>
        /* ===== изоляция только для этой страницы ===== */
        .contacts-page {
            --bg: #0f1117;
            --bg2: #0b0e14;
            --panel: #141922;
            --panel-2: #0e1320;
            --ink: #eef2fb;
            --muted: #9aa4b2;
            --muted2: #cbd3e1;
            --line: rgba(255, 255, 255, .10);
            --accent: #ffbe33;
            --accent-2: #ff7a1a;
            --radius: 16px;
            --rsm: 12px;
            --shadow: 0 24px 48px rgba(0, 0, 0, .45);
            --ring: 0 0 0 3px rgba(255, 190, 51, .25);
            min-height: 100dvh;
            margin: 0;
            color: var(--ink);
            background: radial-gradient(1200px 700px at -12% -18%, #1b2236 0%, transparent 60%),
            radial-gradient(1200px 800px at 112% 118%, #181f33 0%, transparent 60%),
            linear-gradient(180deg, var(--bg2), var(--bg));
            font-family: "Poppins", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        }

        .contacts-page .shell {
            width: min(1100px, 94vw);
            margin: clamp(26px, 6vh, 64px) auto;
            display: grid;
            gap: 16px;
            grid-template-columns: 260px 1fr;
        }

        @media (max-width: 960px) {
            .contacts-page .shell {
                grid-template-columns: 1fr;
            }
        }

        /* заголовок страницы */
        .contacts-page .page-title {
            width: min(1100px, 94vw);
            margin: 24px auto 0;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
        }

        .contacts-page h1 {
            margin: 0;
            font-size: clamp(22px, 3.2vw, 28px);
            background: linear-gradient(180deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: .3px;
        }

        /* боковое меню */
        .contacts-page .sidebar {
            position: relative;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 14px;
            height: max-content;
        }

        /* бургер для мобильного */
        #menu-toggle {
            display: none;
        }

        .contacts-page .menu-toggle {
            display: none;
            margin-bottom: 10px;
            font-weight: 700;
            color: #dfe7fb;
            cursor: pointer;
        }

        .contacts-page .menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .contacts-page .menu a {
            display: block;
            text-decoration: none;
            color: #e7edff;
            padding: 10px 12px;
            border-radius: 12px;
            background: #0f1628;
            border: 1px solid var(--line);
            transition: filter .18s, border-color .18s, transform .06s;
            font-weight: 600;
            letter-spacing: .1px;
        }

        .contacts-page .menu a:hover {
            filter: brightness(1.05);
            border-color: rgba(255, 255, 255, .18);
        }

        .contacts-page .menu a.active {
            background: linear-gradient(180deg, var(--accent), var(--accent-2));
            color: #1b1103;
            border: 0;
            box-shadow: 0 10px 22px rgba(255, 190, 51, .28);
        }

        @media (max-width: 960px) {
            .contacts-page .menu-toggle {
                display: block;
            }

            .contacts-page .menu {
                display: none;
            }

            #menu-toggle:checked + .menu {
                display: flex;
            }
        }

        /* основная панель */
        .contacts-page .panel {
            background: linear-gradient(180deg, rgba(255, 255, 255, .02), rgba(255, 255, 255, .01)), var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: clamp(16px, 3.6vw, 24px);
        }

        .contacts-page .panel h2 {
            margin: 0 0 10px;
            font-size: 18px;
            color: #dfe7fb;
        }

        .contacts-page .lead {
            margin: 0 0 12px;
            color: var(--muted);
        }

        /* алерт для фидбека */
        .contacts-page .alert {
            border-radius: 12px;
            background: #122034;
            color: var(--ink);
            border: 1px solid var(--line);
            padding: 10px 14px;
            margin: 10px 0 16px;
        }

        .contacts-page .d-none {
            display: none !important;
        }

        /* форма */
        .contacts-page .form {
            display: grid;
            gap: 14px;
            grid-template-columns: 1fr 1fr;
        }

        .contacts-page .form .full {
            grid-column: 1 / -1;
        }

        @media (max-width: 720px) {
            .contacts-page .form {
                grid-template-columns: 1fr;
            }
        }

        .contacts-page label {
            display: block;
            margin: 0 0 6px;
            font-size: 12px;
            color: #d7def0;
            font-weight: 700;
        }

        .contacts-page .input {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #0c111e;
            color: var(--ink);
            border: 1px solid var(--line);
            outline: none;
            transition: border-color .18s, box-shadow .18s, background .18s;
            box-sizing: border-box;
        }

        .contacts-page .input:focus {
            border-color: var(--accent);
            box-shadow: var(--ring);
            background: #0b1324;
        }

        /* кнопки */
        .contacts-page .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .contacts-page .btn {
            --bg: #10182a;
            --fg: var(--ink);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 16px;
            min-height: 44px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--fg);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: border-color .18s, filter .18s, transform .06s;
        }

        .contacts-page .btn:hover {
            border-color: rgba(255, 255, 255, .18);
            filter: brightness(1.05);
        }

        .contacts-page .btn:active {
            transform: translateY(1px);
        }

        .contacts-page .btn-primary {
            --bg: linear-gradient(180deg, var(--accent), var(--accent-2));
            --fg: #1b1103;
            border: 0;
            box-shadow: 0 10px 22px rgba(255, 190, 51, .28);
        }

        .contacts-page .btn-ghost {
            --bg: #0f1628;
        }

        /* мелочи */
        .contacts-page .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>

<body class="contacts-page">
<!-- Navbar (partial) -->
<div data-include="/partials/navbar.html"></div>

<div class="page-title">
    <h1>Контактные данные</h1>
</div>

<!-- Контент -->
<main class="shell" data-contacts-endpoint="/api/users/profile">

    <!-- Sidebar -->
    <aside class="sidebar">
        <label class="menu-toggle" for="menu-toggle">Личный кабинет</label>
        <input id="menu-toggle" type="checkbox"/>
        <nav aria-label="Личное меню" class="menu">
            <a href="/account/reservationhistory">История резерваций</a>
            <a href="/account/addresses">Адрес доставки</a>
            <a aria-current="page" class="active" href="/account/contacts">Контактные данные</a>
            <a href="/account/logout">Выход</a>
        </nav>
    </aside>

    <!-- Основная панель -->
    <section aria-labelledby="section-title" class="panel">
        <h2 id="section-title">Ваши контактные данные</h2>
        <p class="lead">Обновите информацию, чтобы мы могли связаться с вами и оформить доставку быстрее.</p>

        <div aria-live="polite" class="alert d-none" id="contacts-feedback" role="alert"></div>

        <!-- Без form: сохраняем ID/структуру под ваш JS -->
        <div class="form">
            <div class="field">
                <label for="contact-name">Имя</label>
                <input autocomplete="name" class="input" id="contact-name" placeholder="Введите имя" type="text"/>
            </div>
            <div class="field">
                <label for="contact-email">Электронная почта</label>
                <input autocomplete="email" class="input" id="contact-email" placeholder="you@example.com"
                       type="email"/>
            </div>
            <div class="field">
                <label for="contact-phone">Телефон</label>
                <input autocomplete="tel" class="input" id="contact-phone" placeholder="+373 600 00 000" type="tel"/>
            </div>
            <div class="field full">
                <label for="contact-address">Адрес</label>
                <input autocomplete="street-address" class="input" id="contact-address" placeholder="Город, улица, дом"
                       type="text"/>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="save-contacts-btn" type="button">Сохранить изменения</button>
            <button class="btn btn-ghost" id="reset-contacts-btn" type="button">Сбросить</button>
        </div>
    </section>
</main>

<!-- Footer (partial) -->
<div data-include="/partials/footer.html"></div>

<!-- JS: только необходимое -->
<script src="/js/jquery-3.4.1.min.js"></script>
<script src="/js/gateway-client.js"></script>
<script src="/js/partials-loader.js"></script>
<script src="/js/account-contacts.js"></script>
</body>
</html>
