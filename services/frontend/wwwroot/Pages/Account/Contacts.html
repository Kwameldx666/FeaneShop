<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link rel="shortcut icon" href="/images/favicon.png" type="image/png">
  <title>Feane - Contact Info</title>
  <link rel="stylesheet" type="text/css" href="/css/bootstrap.css" />
  <link rel="stylesheet" href="/css/account-contacts.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
</head>
<body>
  <div data-include="/partials/navbar.html"></div>

  <main class="container py-5">
    <div class="row">
      <div class="col-lg-8">
        <h1 class="mb-4">Contact Preferences</h1>
        <form class="contact-form" action="http://localhost:5000/api/account/contact" method="post">
          <div id="contacts-feedback" class="alert d-none" role="alert"></div>
          <div class="mb-3">
            <label for="contactEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="contactEmail" name="Email" required />
          </div>
          <div class="mb-3">
            <label for="contactPhone" class="form-label">Phone number</label>
            <input type="tel" class="form-control" id="contactPhone" name="Phone" />
          </div>
          <div class="mb-3">
            <label for="contactNotes" class="form-label">Notes</label>
            <textarea class="form-control" id="contactNotes" name="Notes" rows="4"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Save contact details</button>
        </form>
      </div>
      <div class="col-lg-4">
        <aside class="card p-3">
          <h2 class="h5">Stay connected</h2>
          <p class="mb-0">We will use these details for booking confirmations and order updates.</p>
        </aside>
      </div>
    </div>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/js/jquery-3.4.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
  <script src="/js/bootstrap.js"></script>
  <script src="/js/partials-loader.js"></script>
  <script src="/js/account-contacts.js"></script>
</body>
</html>
