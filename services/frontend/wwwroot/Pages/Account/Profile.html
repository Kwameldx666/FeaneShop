<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link rel="shortcut icon" href="/images/favicon.png" type="image/png">
  <title>Feane - Profile</title>
  <link rel="stylesheet" type="text/css" href="/css/bootstrap.css" />
  <link rel="stylesheet" href="/css/account-profile.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
</head>
<body>
  <div data-include="/partials/navbar.html"></div>

  <main class="profile-wrapper py-5">
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="profile-card text-center p-4">
            <img src="/images/Default.png" alt="User avatar" class="profile-avatar mb-3">
            <h2 class="h4" id="profile-name">Guest User</h2>
            <p id="profile-email" class="text-muted">guest@example.com</p>
            <button class="btn btn-outline-primary" id="edit-profile">Edit profile</button>
          </div>
        </div>
        <div class="col-lg-8">
          <section class="card p-4 mb-4">
            <h3 class="h5">Personal details</h3>
            <dl class="row mb-0">
              <dt class="col-sm-4">Full name</dt>
              <dd class="col-sm-8" id="detail-name">Guest User</dd>
              <dt class="col-sm-4">Email</dt>
              <dd class="col-sm-8" id="detail-email">guest@example.com</dd>
              <dt class="col-sm-4">Phone</dt>
              <dd class="col-sm-8" id="detail-phone">Not provided</dd>
            </dl>
          </section>
          <section class="card p-4">
            <h3 class="h5">Membership</h3>
            <p class="mb-0">Stay tuned! Profile synchronization with the user service can be connected using our REST API.</p>
          </section>
        </div>
      </div>
    </div>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/js/jquery-3.4.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
  <script src="/js/bootstrap.js"></script>
  <script src="/js/partials-loader.js"></script>
</body>
</html>
