<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Reset Password</title>
    <link href="/css/reset-password.css" rel="stylesheet"/>
</head>
<body>
<div class="container">
    <button class="btn" id="forgot-password-btn">Забыли пароль?</button>

    <div aria-hidden="true" class="panel hidden" id="forgot-password-panel">
        <h2>Восстановление пароля</h2>
        <p>Введите E-mail, чтобы получить инструкции по сбросу.</p>

        <label class="sr-only" for="reset-email">Электронная почта</label>
        <input autocomplete="email" id="reset-email" inputmode="email"
               placeholder="Введите вашу почту" type="email"/>

        <button class="btn" id="reset-send-btn">Отправить</button>

        <div aria-live="polite" class="alert alert-success hidden" id="reset-ok" role="status"></div>
        <div aria-live="assertive" class="alert alert-danger  hidden" id="reset-err" role="alert"></div>
    </div>
</div>

<script src="/js/reset-password.js"></script>
</body>
</html>
