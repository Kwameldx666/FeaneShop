<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="stylesheet" href="/css/reset-password.css" />
</head>
<body>
    <div class="container">
        <button id="forgot-password-btn" class="btn">Забыли пароль?</button>

        <div id="forgot-password-panel" class="panel hidden" aria-hidden="true">
            <h2>Восстановление пароля</h2>
            <p>Введите E-mail, чтобы получить инструкции по сбросу.</p>

            <label for="reset-email" class="sr-only">Электронная почта</label>
            <input id="reset-email" type="email" placeholder="Введите вашу почту"
                   autocomplete="email" inputmode="email" />

            <button id="reset-send-btn" class="btn">Отправить</button>

            <div id="reset-ok" class="alert alert-success hidden" role="status" aria-live="polite"></div>
            <div id="reset-err" class="alert alert-danger  hidden" role="alert" aria-live="assertive"></div>
        </div>
    </div>

    <script src="/js/reset-password.js"></script>
</body>
</html>
