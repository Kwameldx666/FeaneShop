<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля</title>
    <link rel="stylesheet" href="/css/account-index.css" />
</head>
<body>
    <div class="container">
        <button id="forgot-password-btn" class="btn">Забыли пароль?</button>

        <div id="forgot-password-form" class="form-container hidden">
            <h2>Восстановление пароля</h2>
            <p>Пожалуйста, введите свою электронную почту, чтобы получить новый пароль.</p>

            <!-- Форма для ввода email -->
            <form action="/account/resetpassword" method="post">
                <input type="email" name="email" placeholder="Введите вашу почту" required>
                <button type="submit" class="btn">Отправить новый пароль</button>
            </form>

            <!-- Сообщения о результате -->
            <p id="success-message" class="message success" style="display:none;">
                Ваш новый пароль отправлен на почту.
            </p>
            <p id="error-message" class="message error" style="display:none; color:red;">
                Произошла ошибка. Пожалуйста, попробуйте снова.
            </p>
        </div>
    </div>

    <script src="/js/account-reset-password.js"></script>
</body>
</html>
