<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link rel="shortcut icon" href="/images/favicon.png" type="image/png">
  <title>Feane - Восстановление пароля</title>
  <link rel="stylesheet" type="text/css" href="/css/bootstrap.css" />
  <link rel="stylesheet" href="/css/account-index.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
</head>
<body>
  <div data-include="/partials/navbar.html"></div>

  <main class="container py-5">
    <h1 class="mb-4">Восстановление пароля</h1>
    <p class="mb-4">Введите адрес электронной почты, чтобы получить ссылку для восстановления пароля.</p>

    <button id="forgot-password-btn" class="btn btn-outline-primary mb-3">Показать форму восстановления</button>

    <form id="forgot-password-form" class="card p-4 hidden" action="http://localhost:5000/api/account/forgot-password" method="post">
      <div class="mb-3">
        <label for="resetEmail" class="form-label">Email</label>
        <input type="email" class="form-control" id="resetEmail" name="email" required />
      </div>
      <button type="submit" class="btn btn-primary">Отправить ссылку</button>
    </form>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/js/jquery-3.4.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
  <script src="/js/bootstrap.js"></script>
  <script src="/js/partials-loader.js"></script>
  <script src="/js/account-reset-password.js"></script>
</body>
</html>
