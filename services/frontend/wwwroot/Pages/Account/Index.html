<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Feane — Account Dashboard</title>
</head>
<body class="adaptive account-dashboard-page">
  <div data-include="/partials/navbar.html"></div>

  <main class="container py-5" data-account-summary-endpoint="/api/account/summary">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-body">
            <h1 class="h5 mb-3">Quick actions</h1>
            <ul class="list-unstyled mb-0">
              <li class="mb-2"><a href="/Pages/Account/Profile.html" class="link-primary">View profile</a></li>
              <li class="mb-2"><a href="/Pages/Account/Addresses.html">Manage addresses</a></li>
              <li class="mb-2"><a href="/Pages/Account/Contacts.html">Update contact info</a></li>
              <li class="mb-2"><a href="/Pages/Reservation/Book.html">Book a table</a></li>
              <li><a href="/Pages/Account/ResetPassword.html">Reset password</a></li>
            </ul>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card shadow-sm border-0 h-100">
          <div class="card-body" id="account-summary">
            <h2 class="h5">Account snapshot</h2>
            <p class="text-muted mb-0">Loading account details…</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/js/account-index.js"></script>
</body>
</html>
