<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация и регистрация</title>

    <!-- Иконки -->
    <link rel="stylesheet"
          href="https://use.fontawesome.com/releases/v5.8.1/css/all.css"
          integrity="sha384-50oBUHEmvpQ+1lW4y57PTFmhCaXp0ML5d60M1M7uH2+nqUivzIebhndOJK28anvf"
          crossorigin="anonymous">

    <!-- Стили -->
    <link rel="stylesheet" href="/css/Auth.css">
</head>

<body>
    <div class="container" id="container">
        <!-- Регистрация -->
        <div class="form-container sign-up-container">
            <form id="registerForm">
                <h1>Регистрация</h1>

                <div class="social-container">
                    <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
                    <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
                </div>

                <input type="text" placeholder="Username" id="username" />
                <span id="errorName" class="text-danger"></span>

                <input type="email" placeholder="Email" id="email" />
                <span id="errorEmail" class="text-danger"></span>

                <input type="password" placeholder="Password" id="password" />
                <span id="errorPassword" class="text-danger"></span>

                <button type="submit">Зарегистрироваться</button>
            </form>
        </div>

        <!-- Авторизация -->
        <div class="form-container sign-in-container">
            <form id="loginForm">
                <h1>Авторизация</h1>

                <div class="social-container">
                    <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
                    <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
                </div>

                <input type="text" placeholder="Name or Email" id="credential" />
                <span id="errorCredential" class="text-danger"></span>

                <input type="password" placeholder="Password" id="login_password" />
                <span id="errorPasswordLogin" class="text-danger"></span>

                <div class="remember-me">
                    <label>
                        <input type="checkbox" id="rememberMe" />
                        Запомнить меня
                    </label>
                </div>


                <button type="submit">Вход</button>
            </form>
        </div>


        <!-- Панели -->
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Добро пожаловать!</h1>
                    <p>Чтобы оставаться на связи с нами, войдите в систему</p>
                    <button class="ghost" id="signIn">Авторизация</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Привет, Друг!</h1>
                    <p>Введите свои данные и начните путешествие вместе с нами</p>
                    <button class="ghost" id="signUp">Регистрация</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="/js/auth.js"></script>
    <script src="/js/account-authentication.js"></script>
</body>
</html>
