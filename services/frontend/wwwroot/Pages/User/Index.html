<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <link href="/images/favicon.png" rel="shortcut icon" type="image/png"/>
    <title>Feane — Users</title>

    <style>
        /* ===== Стили только для этой страницы ===== */
        body.users-page {
            background: radial-gradient(1000px 600px at -10% -10%, #1b2236 0%, transparent 60%),
            radial-gradient(1200px 700px at 110% 120%, #181f33 0%, transparent 60%),
            #0f1115;
            color: #eef2fb;
            font-family: "Poppins", sans-serif;
            margin: 0;
            padding: 0;
        }

        .users-container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
            background: #141922;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 44px rgba(0, 0, 0, 0.35);
            padding: 30px;
        }

        h1 {
            font-size: 26px;
            color: #ffbe33;
            margin-bottom: 20px;
        }

        .alert {
            border-radius: 10px;
            background: #122034;
            color: #eef2fb;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 14px;
            margin-bottom: 16px;
        }

        .d-none {
            display: none !important;
        }

        /* Таблица */
        .users-table-wrapper {
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            background: #0e1320;
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 760px;
            color: #eef2fb;
        }

        thead th {
            background: #10182a;
            color: #cfd6e4;
            font-size: 13px;
            font-weight: 700;
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-align: left;
        }

        tbody td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 14px;
            vertical-align: middle;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        /* Роли и статусы */
        .role-badge {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            background: #121a2b;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .role-badge[data-role="admin"] {
            background: rgba(255, 77, 77, 0.08);
            color: #ffdede;
            border-color: rgba(255, 77, 77, 0.3);
        }

        .role-badge[data-role="manager"] {
            background: rgba(255, 176, 32, 0.1);
            color: #ffeac2;
            border-color: rgba(255, 176, 32, 0.35);
        }

        .role-badge[data-role="user"] {
            background: rgba(46, 204, 113, 0.1);
            color: #d8ffe6;
            border-color: rgba(46, 204, 113, 0.3);
        }

        .state-chip {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(46, 204, 113, 0.1);
            color: #c6ffdf;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .state-chip.inactive {
            background: rgba(255, 77, 77, 0.08);
            color: #ffdede;
            border-color: rgba(255, 77, 77, 0.3);
        }

        /* Кнопки */
        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-edit {
            background-color: #007bff;
            color: #fff;
        }

        .btn-edit:hover {
            background-color: #0a84ff;
        }

        .btn-delete {
            background-color: #e55353;
            color: #fff;
        }

        .btn-delete:hover {
            background-color: #ff6666;
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* Редактор пользователя */
        .user-editor {
            background: #141922;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .user-editor h2 {
            color: #ffbe33;
            margin-top: 0;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #e7eefe;
        }

        input[type="text"],
        input[type="email"],
        select {
            width: 100%;
            background: #0e1320;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #eef2fb;
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
            transition: 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #ffbe33;
            box-shadow: 0 0 0 3px rgba(255, 190, 51, 0.25);
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
        }

        .form-check input {
            width: 18px;
            height: 18px;
            accent-color: #ffbe33;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn-save {
            background: linear-gradient(180deg, #ffbe33, #ff7a1a);
            color: #1b1103;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            box-shadow: 0 8px 20px rgba(255, 190, 51, 0.35);
        }

        .btn-cancel {
            background: #0e1320;
            color: #eef2fb;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 18px;
        }

        @media (max-width: 700px) {
            .actions {
                justify-content: flex-start;
            }

            table {
                font-size: 14px;
            }

            .users-container {
                padding: 20px;
            }
        }
    </style>
</head>

<body class="users-page">
<div data-include="/partials/navbar.html"></div>

<main class="users-container" data-roles-endpoint="/api/users/roles"
      data-users-endpoint="/api/users"
      id="users-root">
    <h1>Users List</h1>

    <div class="alert d-none" id="users-feedback" role="alert"></div>

    <div class="users-table-wrapper">
        <table id="users-table">
            <thead>
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th style="width:180px;">Actions</th>
            </tr>
            </thead>
            <tbody id="users-tbody">
            </tbody>
        </table>
    </div>

    <!-- Editor -->
    <section class="user-editor d-none" id="user-editor">
        <h2>Edit User</h2>
        <form id="user-form" novalidate>
            <input id="user-id" type="hidden"/>

            <div class="form-group">
                <label for="user-username">Username</label>
                <input id="user-username" required type="text"/>
            </div>

            <div class="form-group">
                <label for="user-email">Email</label>
                <input id="user-email" required type="email"/>
            </div>

            <div class="form-group">
                <label for="user-role">Role</label>
                <select id="user-role" required></select>
            </div>

            <div class="form-check">
                <input id="user-active" type="checkbox"/>
                <label for="user-active">Active</label>
            </div>

            <div class="form-buttons">
                <button class="btn-save" type="submit">Save</button>
                <button class="btn-cancel" id="user-cancel" type="button">Cancel</button>
            </div>
        </form>
    </section>
</main>

<div data-include="/partials/footer.html"></div>

<!-- ✅ JS -->
<script src="/js/jquery-3.4.1.min.js"></script>
<script src="/js/gateway-client.js"></script>
<script src="/js/partials-loader.js"></script>
<script src="/js/users-index.js?v=1"></script>
</body>
</html>
