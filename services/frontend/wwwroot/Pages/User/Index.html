<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="/images/favicon.png" type="image/png" />
    <title>Feane — Users</title>

    <!-- Base theme (keep as-is if already used across the site) -->
    <link rel="stylesheet" href="/css/bootstrap.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/navbar.css" />

    <!-- Page look & feel (inline for this page) -->
    <style>
        :root {
            --accent: #ffbe33;
            --accent-2: #ff7a1a;
            --bg: #0f1115;
            --panel: #141922;
            --panel-2: #0e1320;
            --ink: #eef2fb;
            --muted: #9aa4b2;
            --line: rgba(255,255,255,.08);
            --radius: 18px;
            --shadow: 0 20px 44px rgba(0,0,0,.35);
            --ring: 0 0 0 3px rgba(255,190,51,.25);
            --danger: #ff4d4d;
            --success: #2ecc71;
            --warn: #ffb020;
        }

        body.sub_page {
            background: radial-gradient(1100px 520px at -10% -10%, #1b2236 0%, transparent 60%), radial-gradient(1200px 680px at 110% 120%, #181f33 0%, transparent 60%), var(--bg);
            color: var(--ink);
        }

        /* Card container */
        #users-root.container {
            width: min(1100px, 94vw);
            margin: clamp(28px, 6vh, 64px) auto;
            background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015)), var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: clamp(18px, 4vw, 28px);
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }

            #users-root.container::before {
                content: "";
                position: absolute;
                inset: -120px auto auto -120px;
                width: 320px;
                height: 320px;
                border-radius: 50%;
                background: radial-gradient(closest-side, rgba(255,190,51,.22), transparent);
                filter: blur(24px);
                z-index: -1;
                pointer-events: none;
            }

        /* Header */
        #users-root h1 {
            margin: 0 0 12px;
            font-size: clamp(22px, 3.2vw, 28px);
            letter-spacing: .4px;
        }

        /* Feedback */
        #users-feedback {
            border-radius: 12px;
            background: #122034;
            color: var(--ink);
            border: 1px solid var(--line);
            padding: 10px 14px;
            margin-bottom: 14px;
        }

        .d-none {
            display: none !important;
        }

        /* Table wrapper */
        .table-responsive {
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #0e1320;
            padding: 0;
        }

        /* Table */
        table.table {
            margin: 0;
            color: var(--ink);
            border-collapse: collapse;
            min-width: 760px;
        }

            table.table thead th {
                background: #10182a;
                color: #cfd6e4;
                border-bottom: 1px solid var(--line) !important;
                padding: 12px 14px;
                font-size: 13px;
                letter-spacing: .2px;
                position: sticky;
                top: 0;
                z-index: 1;
            }

            table.table tbody td {
                border-bottom: 1px solid var(--line) !important;
                vertical-align: middle;
                padding: 12px 14px;
            }

            table.table tbody tr:hover {
                background: rgba(255,255,255,.02);
            }

        /* Pills & chips */
        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: #121a2b;
            border: 1px solid var(--line);
            color: #e9f0ff;
        }

            .role-badge[data-role="admin"] {
                background: rgba(255,77,77,.08);
                border-color: rgba(255,77,77,.3);
                color: #ffdede;
            }

            .role-badge[data-role="manager"] {
                background: rgba(255,176,32,.1);
                border-color: rgba(255,176,32,.35);
                color: #ffeac2;
            }

            .role-badge[data-role="user"] {
                background: rgba(46,204,113,.1);
                border-color: rgba(46,204,113,.3);
                color: #d8ffe6;
            }

        .state-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(46,204,113,.1);
            border: 1px solid rgba(46,204,113,.35);
            color: #c6ffdf;
        }

            .state-chip.inactive {
                background: rgba(255,77,77,.08);
                border-color: rgba(255,77,77,.3);
                color: #ffdede;
            }

        /* Actions */
        .actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .btn-feane {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            padding: 9px 12px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: #10172a;
            color: var(--ink);
            text-decoration: none;
            font-weight: 700;
            transition: .18s border-color, .18s filter, .08s transform;
            cursor: pointer;
        }

            .btn-feane:hover {
                border-color: rgba(255,255,255,.18);
            }

        .btn-danger {
            background: #201019;
            border-color: rgba(255,77,77,.25);
            color: #ffdede;
        }

        .btn-feane:active {
            transform: translateY(1px);
        }

        .btn-feane[disabled] {
            opacity: .55;
            cursor: not-allowed;
        }

        /* Editor card */
        #user-editor.card {
            border-radius: 14px;
            background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01)), var(--panel);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            margin-top: 16px;
            color: var(--ink);
        }

        #user-editor .card-body {
            padding: clamp(14px, 3vw, 22px);
        }

        #user-editor .form-label {
            color: #e7eefe;
        }

        #user-editor .form-control, #user-editor .form-select {
            color: var(--ink);
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 12px;
            min-height: 44px;
            padding: 10px 12px;
            outline: none;
            transition: .18s border-color, .18s box-shadow, .18s background;
        }

            #user-editor .form-control:focus, #user-editor .form-select:focus {
                border-color: var(--accent);
                box-shadow: var(--ring);
                background: #0c111e;
            }

        #user-editor .form-check-input {
            background: #0c111e;
            border: 1px solid var(--line);
        }

        #user-editor .btn.btn-primary {
            background: linear-gradient(180deg, var(--accent), var(--accent-2));
            border: 0;
            color: #1b1103;
            font-weight: 800;
            border-radius: 12px;
            box-shadow: 0 12px 28px rgba(255,190,51,.32);
        }

        #user-editor .btn.btn-outline-secondary {
            border-color: var(--line);
            color: var(--ink);
            background: #0f1628;
            border-radius: 12px;
        }

        /* Make Bootstrap table head/footer blend with dark */
        .table-striped > tbody > tr:nth-of-type(odd) > * {
            color: var(--ink);
        }

        .table-bordered > :not(caption) > * > * {
            border-color: var(--line);
        }
    </style>
</head>

<body class="sub_page">
    <!-- Navbar -->
    <div data-include="/partials/navbar.html"></div>

    <main class="container py-4" id="users-root"
          data-users-endpoint="/api/users"
          data-roles-endpoint="/api/roles">
        <h1 class="h3 mb-2">Users List</h1>

        <div id="users-feedback" class="alert d-none" role="alert"></div>

        <div class="table-responsive mb-3">
            <table id="users-table" class="table table-striped table-bordered align-middle">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th style="width:180px;">Role</th>
                        <th class="text-end" style="width:210px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="users-tbody"></tbody>
            </table>
        </div>

        <!-- Editor -->
        <section id="user-editor" class="card d-none">
            <div class="card-body">
                <h2 class="h5 mb-3">Edit User</h2>
                <form id="user-form" novalidate>
                    <input type="hidden" id="user-id" />

                    <div class="mb-3">
                        <label for="user-username" class="form-label">Username</label>
                        <input id="user-username" type="text" class="form-control" required />
                        <div class="invalid-feedback">Введите имя пользователя.</div>
                    </div>

                    <div class="mb-3">
                        <label for="user-email" class="form-label">Email</label>
                        <input id="user-email" type="email" class="form-control" required />
                        <div class="invalid-feedback">Введите корректный email.</div>
                    </div>

                    <div class="mb-3">
                        <label for="user-role" class="form-label">Role</label>
                        <select id="user-role" class="form-select" required>
                            <!-- filled from API -->
                        </select>
                        <div class="invalid-feedback">Выберите роль.</div>
                    </div>

                    <div class="form-check mb-3">
                        <input id="user-active" class="form-check-input" type="checkbox" />
                        <label class="form-check-label" for="user-active">Active</label>
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <button type="button" id="user-cancel" class="btn btn-outline-secondary">Cancel</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div data-include="/partials/footer.html"></div>

    <!-- Scripts -->
    <script src="/js/jquery-3.4.1.min.js"></script>
    <script src="/js/bootstrap.js"></script>
    <script src="/js/partials-loader.js"></script>
    <script src="/js/admin-users.js?v=1"></script>
    <script src="/js/custom.js"></script>
</body>
</html>
