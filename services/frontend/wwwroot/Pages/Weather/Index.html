<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link rel="shortcut icon" href="/images/favicon.png" type="image/png">
  <title>Feane - Weather</title>
  <link rel="stylesheet" type="text/css" href="/css/bootstrap.css" />
  <link rel="stylesheet" href="/css/weather-index.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
</head>
<body>
  <div data-include="/partials/navbar.html"></div>

  <main class="container py-5" data-weather-endpoint="/api/weather/today">
    <h1 class="mb-4">Today's Weather</h1>
    <div class="weather-card">
      <div class="weather-main">
        <h2 id="weather-city">Chisinau</h2>
        <p id="weather-description">Partly cloudy</p>
        <span id="weather-temp" class="display-4">22°C</span>
      </div>
      <div class="weather-details">
        <p>Humidity: <span id="weather-humidity">58%</span></p>
        <p>Wind: <span id="weather-wind">12 km/h</span></p>
        <p>Feels like: <span id="weather-feels">21°C</span></p>
      </div>
    </div>
    <section class="card p-4 mt-4">
      <h2 class="h5">Integration hint</h2>
      <p class="mb-0">Call your weather API from JavaScript and replace these sample values to keep your guests informed.</p>
    </section>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/js/jquery-3.4.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
  <script src="/js/bootstrap.js"></script>
  <script src="/js/partials-loader.js"></script>
  <script src="/js/gateway-client.js"></script>
  <script src="/js/weather-index.js"></script>
</body>
</html>
