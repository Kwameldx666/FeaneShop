<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link rel="shortcut icon" href="/images/favicon.png" type="image/png">
  <title>Feane - Analytics</title>
  <link rel="stylesheet" type="text/css" href="/css/bootstrap.css" />
  <link rel="stylesheet" href="/css/analytics-index.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
</head>
<body>
  <div data-include="/partials/navbar.html"></div>

  <main class="container py-5" data-analytics-endpoint="/api/analytics/summary">
    <h1 class="mb-4">Analytics Dashboard</h1>
    <p class="text-muted">Hook this dashboard to your analytics microservice to visualize revenue, orders, and customer activity.</p>
    <div id="analytics-feedback" class="alert d-none" role="alert"></div>
    <div id="analytics-stats" class="row g-4"></div>
    <section class="card p-4 mt-4" id="analytics-next-steps">
      <h2 class="h5">Next steps</h2>
      <p class="mb-0">Use JavaScript charting libraries (Chart.js, ApexCharts, etc.) to replace these placeholders with real-time data.</p>
    </section>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/js/jquery-3.4.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
  <script src="/js/bootstrap.js"></script>
  <script src="/js/partials-loader.js"></script>
  <script src="/js/gateway-client.js"></script>
  <script src="/js/analytics-index.js"></script>
</body>
</html>
