<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link rel="shortcut icon" href="/images/favicon.png" type="image/png">
  <title>Feane - Notification Filters</title>
  <link rel="stylesheet" type="text/css" href="/css/bootstrap.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
</head>
<body>
  <div data-include="/partials/navbar.html"></div>

  <main class="container py-5">
    <h1 class="mb-4">Notification Filters</h1>
    <div id="notification-filters-feedback" class="alert d-none" role="alert"></div>
    <form id="notification-filters-form" class="card p-4" action="http://localhost:5000/api/notifications/filters"
      method="post" data-gateway-endpoint="/api/notifications/filters">
      <div class="mb-3">
        <label class="form-label" for="typeFilter">Type</label>
        <select class="form-select" id="typeFilter" name="Type">
          <option value="">All</option>
          <option value="orders">Orders</option>
          <option value="reservations">Reservations</option>
          <option value="system">System</option>
        </select>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="emailFilter" name="Email" value="true" checked>
        <label class="form-check-label" for="emailFilter">Show email notifications</label>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="smsFilter" name="Sms" value="true">
        <label class="form-check-label" for="smsFilter">Show SMS notifications</label>
      </div>
      <button type="submit" class="btn btn-primary">Apply filters</button>
    </form>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/js/jquery-3.4.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
  <script src="/js/bootstrap.js"></script>
  <script src="/js/partials-loader.js"></script>
  <script src="/js/gateway-client.js"></script>
  <script src="/js/notifications-filters.js"></script>
</body>
</html>
