<script src="/js/navbar-role.js"></script>
<script>
  (function () {
    var style = document.createElement('style');
    style.textContent = 'body[data-role-debug*="admin"] .feane-admin{display:inline-flex !important;visibility:visible !important;opacity:1 !important;}';
    document.head.appendChild(style);

    function showAdminLinks() {
      var role = null;
      try {
        role = (localStorage.getItem('userRole') || sessionStorage.getItem('userRole') || '').toLowerCase();
      } catch (_) { }

      if (role === 'admin') {
        try {
          document.body.setAttribute('data-role-debug', 'admin');
        } catch (_) { }

        var nodes = document.querySelectorAll('.feane-admin');
        nodes.forEach(function (node) {
          node.classList.remove('d-none');
          node.removeAttribute('aria-hidden');
          node.style.removeProperty('display');
        });
      }
    }

    document.addEventListener('feane:user-role-changed', showAdminLinks);
    document.addEventListener('DOMContentLoaded', showAdminLinks);
    showAdminLinks();
  })();
</script>
