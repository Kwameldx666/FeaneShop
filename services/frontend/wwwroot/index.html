  <style>
    .feane-loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.9);
      z-index: 9999;
      transition: opacity 0.2s ease-in-out;
    }

    .feane-loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .feane-loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #f2f2f2;
      border-top-color: #ffbe33;
      border-radius: 50%;
      animation: feane-spin 0.8s linear infinite;
    }

    @keyframes feane-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body data-feane-router="true" class="feane-app">
  <div id="app"></div>

  <div id="feane-loader" class="feane-loading-overlay hidden" aria-hidden="true">
    <div class="feane-loading-spinner" role="status" aria-label="Loading"></div>
  </div>

  <script src="/js/gateway-client.js"></script>
