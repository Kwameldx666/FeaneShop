server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование api-запросов остается задачей gateway, поэтому все /api/* обслуживаются как статика
    location /api/ {
        try_files $uri $uri/ /index.html;
    }
}
