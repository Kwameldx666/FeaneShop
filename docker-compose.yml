version: "3.9"

services:
  catalog-api:
    build:
      context: ./services/CatalogService
      dockerfile: Dockerfile
    image: feane/catalog-service
    ports:
      - "5001:8080"

  ordering-api:
    build:
      context: ./services/OrderingService
      dockerfile: Dockerfile
    image: feane/ordering-service
    ports:
      - "5002:8080"

  reservation-api:
    build:
      context: ./services/ReservationService
      dockerfile: Dockerfile
    image: feane/reservation-service
    ports:
      - "5003:8080"

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: feane/gateway
    ports:
      - "8080:8080"
    environment:
      Downstream__Catalog: http://catalog-api:8080
      Downstream__Ordering: http://ordering-api:8080
      Downstream__Reservation: http://reservation-api:8080
    depends_on:
      - catalog-api
      - ordering-api
      - reservation-api
