version: '3.9'
services:
  user-service:
    build: ./services/user-service
    ports:
      - "5001:5001"
  product-service:
    build: ./services/product-service
    ports:
      - "5002:5002"
  cart-service:
    build: ./services/cart-service
    ports:
      - "5003:5003"
  order-service:
    build: ./services/order-service
    ports:
      - "5004:5004"
  payment-service:
    build: ./services/payment-service
    ports:
      - "5005:5005"
  delivery-service:
    build: ./services/delivery-service
    ports:
      - "5006:5006"
  gateway:
    build: ./services/gateway
    depends_on:
      - user-service
      - product-service
    ports:
      - "8080:8080"
  frontend:
    build: ./services/frontend
    ports:
      - "3000:3000"
    depends_on:
      - gateway
