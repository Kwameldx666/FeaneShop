x-auth-db-connection: &auth-db-connection
  ConnectionStrings__DefaultConnection: "${AUTH_DB_CONNECTION:-Server=${AUTH_DB_HOST:-sqlserver};Database=${AUTH_DB_NAME:-Feane.AuthServiceDb};User Id=${AUTH_DB_USER:-sa};Password=${AUTH_DB_PASSWORD:-YourStrong!Passw0rd};Encrypt=True;TrustServerCertificate=True;}"

x-user-db-connection: &user-db-connection
  ConnectionStrings__DefaultConnection: "${USER_DB_CONNECTION:-Server=${USER_DB_HOST:-sqlserver};Database=${USER_DB_NAME:-Feane.UserServiceDb};User Id=${USER_DB_USER:-sa};Password=${USER_DB_PASSWORD:-YourStrong!Passw0rd};Encrypt=True;TrustServerCertificate=True;}"

x-product-db-connection: &product-db-connection
  ConnectionStrings__DefaultConnection: "${PRODUCT_DB_CONNECTION:-Server=${PRODUCT_DB_HOST:-sqlserver};Database=${PRODUCT_DB_NAME:-Feane.ProductServiceDb};User Id=${PRODUCT_DB_USER:-sa};Password=${PRODUCT_DB_PASSWORD:-YourStrong!Passw0rd};Encrypt=True;TrustServerCertificate=True;}"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${AUTH_DB_PASSWORD:-YourStrong!Passw0rd}"
      MSSQL_PID: "Developer"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/1433'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  auth-service:
    build:
      context: ./services/auth-service/src/AuthService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      <<: *auth-db-connection
      JwtSettings__Issuer: ${AUTH_JWT_ISSUER:-Feane.AuthService}
      JwtSettings__Audience: ${AUTH_JWT_AUDIENCE:-Feane.Clients}
      JwtSettings__SecretKey: ${AUTH_JWT_SECRET:-A38665B7-1B5A-4F62-A392-E9274BBA4A96}
      UserService__BaseUrl: http://user-service:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AUTH_SERVICE_PORT:-5010}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  user-service:
    build:
      context: ./services/user-service/src/UserService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      <<: *user-db-connection
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${USER_SERVICE_PORT:-5020}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  product-service:
    build:
      context: ./services/product-service/src/ProductService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      <<: *product-db-connection
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PRODUCT_SERVICE_PORT:-5030}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  feane-gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      JwtSettings__Issuer: ${GATEWAY_JWT_ISSUER:-FeaneMVC}
      JwtSettings__Audience: ${GATEWAY_JWT_AUDIENCE:-FeaneMVCUsers}
      JwtSettings__SecretKey: ${AUTH_JWT_SECRET:-A38665B7-1B5A-4F62-A392-E9274BBA4A96}
    depends_on:
      - auth-service
      - product-service
    ports:
      - "${GATEWAY_PORT:-5000}:8080"

  feane-frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - feane-gateway
    ports:
      - "${FEANE_FRONTEND_PORT:-5003}:8080"

networks:
  default:
    driver: bridge

volumes:
  sqlserver-data:
