x-auth-db-connection: &auth-db-connection
  ConnectionStrings__DefaultConnection: "${AUTH_DB_CONNECTION:-Server=${AUTH_DB_HOST:-sqlserver};Database=${AUTH_DB_NAME:-Feane.AuthServiceDb};User Id=${AUTH_DB_USER:-sa};Password=${AUTH_DB_PASSWORD:-YourStrong!Passw0rd};Encrypt=False;TrustServerCertificate=True;}"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${AUTH_DB_PASSWORD:-YourStrong!Passw0rd}"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${AUTH_DB_PASSWORD:-YourStrong!Passw0rd}", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./services/auth-service/src/AuthService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      <<: *auth-db-connection
      JwtSettings__Issuer: ${AUTH_JWT_ISSUER:-Feane.AuthService}
      JwtSettings__Audience: ${AUTH_JWT_AUDIENCE:-Feane.Clients}
      JwtSettings__SecretKey: ${AUTH_JWT_SECRET:-A38665B7-1B5A-4F62-A392-E9274BBA4A96}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AUTH_SERVICE_PORT:-5010}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  feane-gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      JwtSettings__Issuer: ${GATEWAY_JWT_ISSUER:-FeaneMVC}
      JwtSettings__Audience: ${GATEWAY_JWT_AUDIENCE:-FeaneMVCUsers}
      JwtSettings__SecretKey: ${AUTH_JWT_SECRET:-A38665B7-1B5A-4F62-A392-E9274BBA4A96}
    depends_on:
      - auth-service
    ports:
      - "${GATEWAY_PORT:-5000}:8080"

  feane-frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - feane-gateway
    ports:
      - "${FEANE_FRONTEND_PORT:-5003}:8080"

networks:
  default:
    driver: bridge

volumes:
  sqlserver-data: