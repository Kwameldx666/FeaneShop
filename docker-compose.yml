version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/src/AuthService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Feane.AuthServiceDb;User Id=sa;Password=Your_password123;TrustServerCertificate=true;Encrypt=False;"
    depends_on:
      - sqlserver
    ports:
      - "5010:8080"

  feane-gateway:
    build:
      context: .
      dockerfile: FeaneGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - auth-service
    ports:
      - "5000:8080"

  webapplication1:
    build:
      context: .
      dockerfile: WebApplication1/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - sqlserver
      - auth-service
    ports:
      - "5002:8080"

  feane-mvc:
    build:
      context: .
      dockerfile: src/FeaneMVC/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FeaneMvcDb;User Id=sa;Password=Your_password123;TrustServerCertificate=true;Encrypt=False;"
      JwtSettings__Issuer: "FeaneMVC"
      JwtSettings__Audience: "FeaneMVCUsers"
      JwtSettings__SecretKey: "A38665B7-1B5A-4F62-A392-E9274BBA4A96"
    depends_on:
      - sqlserver
      - auth-service
    ports:
      - "5002:8080"

  feane-frontend:
    build:
      context: .
      dockerfile: Feane.Frontend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - feane-gateway
    ports:
      - "5003:8080"

volumes:
  sqlserver-data: