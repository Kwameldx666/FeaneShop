# 🔹 Глобальные алиасы для строк подключения
x-auth-db-connection: &auth-db-connection
  ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Feane.AuthServiceDb;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=True;TrustServerCertificate=True;"

x-user-db-connection: &user-db-connection
  ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Feane.UserServiceDb;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=True;TrustServerCertificate=True;"

x-product-db-connection: &product-db-connection
  ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Feane.ProductServiceDb;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=True;TrustServerCertificate=True;"

x-book-db-connection: &book-db-connection
  ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Feane.BookServiceDb;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=True;TrustServerCertificate=True;"

x-reservation-db-connection: &reservation-db-connection
  ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Feane.ReservationServiceDb;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=True;TrustServerCertificate=True;"

x-cart-db-connection: &cart-db-connection
  ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Feane.CartServiceDb;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=True;TrustServerCertificate=True;"

x-order-db-connection: &order-db-connection
  ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Feane.OrderServiceDb;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=True;TrustServerCertificate=True;"

x-analytics-db-connection: &analytics-db-connection
  ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Feane.AnalyticsServiceDb;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=True;TrustServerCertificate=True;"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/1433'" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  user-service:
    build:
      context: ./services/user-service/src/UserService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      <<: *user-db-connection
    ports:
      - "5020:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  product-service:
    build:
      context: ./services/product-service/src/ProductService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      <<: *product-db-connection
    ports:
      - "5030:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  book-service:
    build:
      context: ./services/book-service/src/BookService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      <<: *book-db-connection
    ports:
      - "5040:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  reservation-service:
    build:
      context: ./services/reservation-service/src/ReservationService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      DOTNET_Dbg_EnableDiagnostics: "1"
      JwtSettings__Issuer: FeaneMVC
      JwtSettings__Audience: FeaneMVCUsers
      JwtSettings__SecretKey: A38665B7-1B5A-4F62-A392-E9274BBA4A96
      <<: *reservation-db-connection
    ports:
      - "5050:8080"
      - "56000:56000"
    depends_on:
      sqlserver:
        condition: service_healthy

  cart-service:
    build:
      context: ./services/cart-service/src/CartService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      DOTNET_Dbg_EnableDiagnostics: "1"
      JwtSettings__Issuer: FeaneMVC
      JwtSettings__Audience: FeaneMVCUsers
      JwtSettings__SecretKey: A38665B7-1B5A-4F62-A392-E9274BBA4A96
      <<: *cart-db-connection
    ports:
      - "5060:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  order-service:
    build:
      context: ./services/OrderService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      DOTNET_Dbg_EnableDiagnostics: "1"
      JwtSettings__Issuer: FeaneMVC
      JwtSettings__Audience: FeaneMVCUsers
      JwtSettings__SecretKey: A38665B7-1B5A-4F62-A392-E9274BBA4A96
      <<: *order-db-connection
    ports:
      - "5070:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  analytics-service:
    build:
      context: ./services/AnalyticsService
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      DOTNET_Dbg_EnableDiagnostics: "1"
      JwtSettings__Issuer: FeaneMVC
      JwtSettings__Audience: FeaneMVCUsers
      JwtSettings__SecretKey: A38665B7-1B5A-4F62-A392-E9274BBA4A96
      <<: *analytics-db-connection
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  feane-gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      JwtSettings__Issuer: FeaneMVC
      JwtSettings__Audience: FeaneMVCUsers
      JwtSettings__SecretKey: A38665B7-1B5A-4F62-A392-E9274BBA4A96
      <<: *auth-db-connection
      UserService__BaseUrl: http://user-service:8080
      BookService__BaseUrl: http://book-service:8080
      ReservationService__BaseUrl: http://reservation-service:8080
      CartService__BaseUrl: http://cart-service:8080
      OrderService__BaseUrl: http://order-service:8080
      AnalyticsService__BaseUrl: http://analytics-service:8080
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      book-service:
        condition: service_started
      reservation-service:
        condition: service_started
      cart-service:
        condition: service_started
      order-service:
        condition: service_started
      analytics-service:
        condition: service_started

  feane-frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5003:8080"
    depends_on:
      - feane-gateway

networks:
  default:
    driver: bridge

volumes:
  sqlserver-data:
