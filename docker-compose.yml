version: "3.9"

x-auth-db-connection: &auth-db-connection
  ConnectionStrings__DefaultConnection: "${AUTH_DB_CONNECTION:-Server=${SQLSERVER_HOST:-host.docker.internal}\\${SQLSERVER_INSTANCE:-SQLEXPRESS};Database=${AUTH_DB_NAME:-Feane.AuthServiceDb};Trusted_Connection=True;MultipleActiveResultSets=true;Encrypt=False;TrustServerCertificate=True;}"

x-mvc-db-connection: &mvc-db-connection
  ConnectionStrings__DefaultConnection: "${MVC_DB_CONNECTION:-Server=${SQLSERVER_HOST:-host.docker.internal}\\${SQLSERVER_INSTANCE:-SQLEXPRESS};Database=${MVC_DB_NAME:-FeaneMvcDb};Trusted_Connection=True;MultipleActiveResultSets=true;Encrypt=False;TrustServerCertificate=True;}"

services:
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/src/AuthService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      <<: *auth-db-connection
      JwtSettings__Issuer: ${AUTH_JWT_ISSUER:-Feane.AuthService}
      JwtSettings__Audience: ${AUTH_JWT_AUDIENCE:-Feane.Clients}
      JwtSettings__SecretKey: ${AUTH_JWT_SECRET:-A38665B7-1B5A-4F62-A392-E9274BBA4A96}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AUTH_SERVICE_PORT:-5010}:8080"

  feane-gateway:
    build:
      context: .
      dockerfile: FeaneGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      JwtSettings__Issuer: ${GATEWAY_JWT_ISSUER:-FeaneMVC}
      JwtSettings__Audience: ${GATEWAY_JWT_AUDIENCE:-FeaneMVCUsers}
      JwtSettings__SecretKey: ${AUTH_JWT_SECRET:-A38665B7-1B5A-4F62-A392-E9274BBA4A96}
    depends_on:
      - auth-service
    ports:
      - "${GATEWAY_PORT:-5000}:8080"

  feane-mvc:
    build:
      context: .
      dockerfile: src/FeaneMVC/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      <<: *mvc-db-connection
      JwtSettings__Issuer: ${MVC_JWT_ISSUER:-FeaneMVC}
      JwtSettings__Audience: ${MVC_JWT_AUDIENCE:-FeaneMVCUsers}
      JwtSettings__SecretKey: ${AUTH_JWT_SECRET:-A38665B7-1B5A-4F62-A392-E9274BBA4A96}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FEANE_MVC_PORT:-5001}:8080"

  feane-frontend:
    build:
      context: .
      dockerfile: Feane.Frontend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - feane-gateway
    ports:
      - "${FEANE_FRONTEND_PORT:-5003}:8080"
